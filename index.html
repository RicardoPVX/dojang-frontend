<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dojang — MMW MDK La Industrial</title>
<meta name="theme-color" content="#f4f4f1">
<link rel="icon" href="assets/logo-moonmoowon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="sin-sesion">
<aside class="side glass" aria-label="Navegación">
  <div class="side-marca"><img src="assets/logo-moonmoowon.png" alt=""><div><b>MMW MDK</b><span>La Industrial</span></div></div>
  <button class="registrar" data-act="cmd"><span id="reg-ico"></span><span id="reg-t">Registrar…</span><kbd id="kbd">Ctrl K</kbd></button>
  <nav class="nav" id="nav"></nav>
  <div class="side-pie" id="side-pie"></div>
</aside>
<main id="main"></main>
<nav class="tabs glass" id="tabs" aria-label="Navegación"></nav>
<div id="velo"></div>
<aside id="ins" class="glass" aria-label="Detalle" tabindex="-1"></aside>
<div id="cmd" role="dialog" aria-modal="true" aria-label="Registrar">
  <div id="cmd-velo"></div>
  <div class="cmd-caja" id="cmd-caja">
    <div class="cmd-entrada"><span id="cmd-ico"></span><input id="cmd-in" autocomplete="off" spellcheck="false" aria-label="Qué quieres registrar"></div>
    <div class="cmd-res" id="cmd-res" role="listbox"></div>
  </div>
</div>
<div id="guardando" role="status">Guardando…</div>
<div id="aviso" class="glass" role="status" aria-live="polite"><span id="aviso-t"></span><button id="aviso-b">Deshacer</button></div>
<script src="js/nucleo.js"></script>
<script src="js/hojas.js"></script>
<script src="js/escuela.js"></script>
<script src="js/familia.js"></script>
<script src="js/app.js"></script>
</body>
</html>
