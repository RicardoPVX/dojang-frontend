        {misAlumnos.map(a=><button key={a.id} className={`tk-btn btn-sm ${a.id===student.id?"btn-red":"btn-ghost"}`} onClick={()=>setAlumnoId(a.id)}>{a.name}</button>)}
      </div>}
      <div style={{background:"#0e0e18",borderBottom:"1px solid #1a1a28",display:"flex",padding:"0 28px"}}>
        {tabs.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{display:"flex",alignItems:"center",gap:8,padding:"14px 18px",background:"none",border:"none",cursor:"pointer",color:tab===t.id?"#ff4444":"#7070a0",borderBottom:tab===t.id?"2px solid #c01212":"2px solid transparent",fontFamily:"'Exo 2',sans-serif",fontSize:13,fontWeight:tab===t.id?600:400,transition:"all .15s",letterSpacing:.3,position:"relative"}}>
            <Icon name={t.icon} size={14}/>{t.label}
            {t.id==="exams"&&daysToExam>=0&&daysToExam<=21&&<span className="pulse-dot" style={{position:"absolute",top:10,right:6,background:daysToExam<=7?"#f87171":"#d4960f",boxShadow:`0 0 6px ${daysToExam<=7?"#f87171":"#d4960f"}`}}/>}
          </button>
        ))}
      </div>
      <div style={{padding:"28px 32px",maxWidth:920,margin:"0 auto"}}>

        {/* PERFIL */}
        {tab==="profile"&&(
          <div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:16}}>
              <div className="card" style={{padding:24}}>
                <div style={{display:"flex",alignItems:"center",gap:16,marginBottom:18}}>
                  <div style={{width:56,height:56,borderRadius:"50%",background:belt.bg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:24}}>🥷</div>
                  <div><div style={{color:"#f0f0fa",fontWeight:600,fontSize:16}}>{student.name}</div><BeltBadge belt={student.belt}/></div>
                </div>
                <div style={{display:"grid",gap:10}}>
                  {[{label:"Edad",value:`${student.age} años`},{label:"Fecha de ingreso",value:fmtDate(student.joined)},...(student.claseNombre?[{label:"Clase",value:student.claseNombre}]:[]),...(student.claseDias?[{label:"Días",value:student.claseDias}]:[]),...(student.claseHora?[{label:"Horario",value:student.claseHora}]:[]),{label:"Día de pago",value:`Día ${student.diaPago||1} de cada mes`},{label:"Exámenes aprobados",value:`${approvedExams}`},{label:"Estatus",value:student.active?"Activo ✓":"Inactivo"}].map(row=>(
                    <div key={row.label} style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:"1px solid #151520"}}>
                      <span style={{color:"#555577",fontSize:12}}>{row.label}</span><span style={{color:"#dde0ee",fontSize:13}}>{row.value}</span>
                    </div>
                  ))}
                </div>
              </div>
              <div className="card" style={{padding:24}}>
                <div style={{fontSize:12,color:"#555577",letterSpacing:.8,textTransform:"uppercase",marginBottom:14}}>Contacto del tutor</div>
                <div style={{display:"grid",gap:10}}>
                  {[{label:"Nombre",value:student.parent},{label:"Teléfono",value:student.phone},{label:"Correo",value:student.email}].map(row=>(
                    <div key={row.label} style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:"1px solid #151520"}}>
                      <span style={{color:"#555577",fontSize:12}}>{row.label}</span><span style={{color:"#dde0ee",fontSize:13}}>{row.value||"—"}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            {/* Datos personales editables */}
            <div className="card" style={{padding:24,marginBottom:16}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
                <div style={{fontSize:12,color:"#555577",letterSpacing:.8,textTransform:"uppercase"}}>Mis datos personales</div>
                <button className="tk-btn btn-blue btn-sm" onClick={()=>setEditPersonal(true)}><Icon name="edit" size={13}/>Editar mis datos</button>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                {[
                  {label:"Dirección",value:p.address||"—"},
                  {label:"Tipo de sangre",value:p.blood||"—"},
                  {label:"Contacto de emergencia",value:p.emergency||"—"},
                  {label:"Tel. emergencia",value:p.emergencyPhone||"—"},
                ].map(row=>(
                  <div key={row.label} style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:"1px solid #151520"}}>
                    <span style={{color:"#555577",fontSize:12}}>{row.label}</span><span style={{color:"#dde0ee",fontSize:13}}>{row.value}</span>
                  </div>
                ))}
              </div>
              {p.medNotes&&(
                <div style={{marginTop:12,padding:"10px 14px",background:"rgba(192,18,18,.06)",borderRadius:8,border:"1px solid rgba(192,18,18,.15)"}}>
                  <div style={{fontSize:11,color:"#555577",textTransform:"uppercase",letterSpacing:.7,marginBottom:4}}>Notas médicas</div>
                  <div style={{fontSize:13,color:"#b0b0cc"}}>{p.medNotes}</div>
                </div>
              )}
              {!p.address&&!p.blood&&!p.emergency&&(
                <div style={{textAlign:"center",padding:"20px 0",color:"#4a4a6a",fontSize:13}}>
                  Sin datos personales aún. <button onClick={()=>setEditPersonal(true)} style={{background:"none",border:"none",color:"#c01212",cursor:"pointer",fontSize:13,textDecoration:"underline"}}>Agregar ahora</button>
                </div>
              )}
            </div>

            <div className="card" style={{padding:24}}>
              <div style={{fontSize:12,color:"#555577",letterSpacing:.8,textTransform:"uppercase",marginBottom:16}}>Progresión de cinturones</div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(82px,1fr))",gap:12}}>
                {BELT_LIST.map((b,i)=>{
                  const bm=BELT_MAP[b];const isCurrent=b===student.belt;const beltIdx=BELT_LIST.indexOf(student.belt);const achieved=i<=beltIdx;
                  return(
                    <div key={b} style={{textAlign:"center"}}>
                      <div style={{width:28,height:28,borderRadius:"50%",background:achieved?beltFondo(bm):"#1a1a2a",border:isCurrent?`2px solid ${bm.bg}`:"2px solid #2a2a40",margin:"0 auto 4px",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,color:bm.text,boxShadow:isCurrent?`0 0 12px ${bm.bg}55`:"none"}}>{isCurrent?"✓":""}</div>
                      <div style={{fontSize:10,color:isCurrent?"#f0f0fa":"#66668a",letterSpacing:.3,lineHeight:1.25}}>{b}</div>
                      {bm.grado&&<div style={{fontSize:9,color:"#44446a",marginTop:2}}>{bm.grado}</div>}
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        )}

        {/* EXÁMENES */}
        {tab==="exams"&&(
          <div>
            <div className="section-title" style={{marginBottom:20}}>MIS EXÁMENES</div>
            <ExamReminder nextDate={nextExamDate}/>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginBottom:24}}>
              {[{label:"Presentados",value:exams.length,color:"#dde0ee"},{label:"Aprobados",value:approvedExams,color:"#4ade80"},{label:"Días al próximo",value:daysToExam<0?"Vencido":`${daysToExam}d`,color:daysToExam<0?"#f87171":daysToExam<=14?"#d4960f":"#60a5fa"}].map(s=>(
                <div key={s.label} className="stat-card"><div className="stat-value" style={{color:s.color}}>{s.value}</div><div className="stat-label">{s.label}</div></div>
              ))}
            </div>
            <div style={{fontSize:12,color:"#555577",letterSpacing:.8,textTransform:"uppercase",marginBottom:16}}>Historial cronológico</div>
            <ExamTimeline exams={exams}/>
            {exams.length>0&&(
              <div style={{paddingLeft:32,marginTop:18}}>
                <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:8}}><div style={{height:1,flex:1,background:"#1e1e2e",maxWidth:60}}/><span style={{fontSize:10,color:"#555577",background:"#0e0e18",border:"1px solid #1e1e2e",padding:"2px 8px",borderRadius:20,whiteSpace:"nowrap"}}>{EXAM_MONTHS} meses después</span><div style={{height:1,flex:1,background:"#1e1e2e",maxWidth:20}}/></div>
                <div style={{background:daysToExam<=14?"rgba(212,150,15,.08)":"rgba(74,222,128,.05)",border:`1px dashed ${daysToExam<=14?"#d4960f":"#4ade80"}`,borderRadius:8,padding:"12px 16px",display:"flex",alignItems:"center",gap:12}}>
                  <div style={{fontSize:20}}>🎯</div>
                  <div><div style={{color:daysToExam<=7?"#f87171":daysToExam<=14?"#d4960f":"#4ade80",fontWeight:600,fontSize:13}}>Próximo examen estimado</div><div style={{color:"#9090b0",fontSize:12,marginTop:2}}>{fmtDate(nextExamDate)} · {daysToExam>=0?`faltan ${daysToExam} días`:`venció hace ${Math.abs(daysToExam)} días`}</div></div>
                </div>
              </div>
            )}
          </div>
        )}

        {/* PAGOS */}
        {tab==="payments"&&(
          <div>
            <div className="section-title" style={{marginBottom:20}}>MIS PAGOS Y LIQUIDACIONES</div>
            {(()=>{
              const hoy=new Date(); hoy.setHours(0,0,0,0);
              if(hoy<INICIO_MENSUALIDADES) return null;
              const mes=hoy.getMonth(), anio=hoy.getFullYear();
              const dia=student.diaPago||1;
              const pagada=payments.some(p=>esMensualidadDe(p,mes,anio));
              const due=new Date(anio,mes,dia);
              const vencida=!pagada&&hoy>due;
              const color=pagada?"#4ade80":vencida?"#f87171":"#d4960f";
              const bg=pagada?"rgba(74,222,128,.08)":vencida?"rgba(239,68,68,.1)":"rgba(212,150,15,.08)";
              const estado=pagada?"✓ Pagada":vencida?"⚠ Vencida":"Pendiente";
              const msg=pagada?`Tu mensualidad de ${MESES[mes]} está al corriente. ¡Gracias!`:vencida?`Tu pago ya se pasó de su fecha (vencía el día ${dia}). Ponte al corriente lo antes posible.`:`Tu mensualidad de ${MESES[mes]} vence el día ${dia} de este mes.`;
              return(
                <div className="card" style={{padding:22,marginBottom:16,borderLeft:`3px solid ${color}`,background:bg}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:12,flexWrap:"wrap"}}>
                    <div>
                      <div style={{color:"#f0f0fa",fontWeight:600,fontSize:15}}>Mensualidad · {MESES[mes]} {anio}</div>
                      <div style={{color,fontSize:14,fontWeight:700,marginTop:4}}>{estado}</div>
                      <div style={{color:"#9090b0",fontSize:12,marginTop:6,maxWidth:380}}>{msg}</div>
                    </div>
                    <div style={{textAlign:"right"}}><div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:28,color:"#f0f0fa",lineHeight:1}}>$500</div><div style={{fontSize:11,color:"#555577",marginTop:2}}>al mes · día {dia}</div></div>
                  </div>
                </div>
              );
            })()}
            {(()=>{
              const planes=payments.filter(p=>p.concept!=="Mensualidad");
              return planes.length===0?<div className="card empty-state" style={{padding:40}}><div className="empty-icon">✅</div><div>Sin otros pagos</div></div>:(
              <div style={{display:"grid",gap:14}}>
                {planes.map(p=>(
                  <div key={p.id} className="card" style={{padding:22}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14}}>
                      <div><div style={{color:"#f0f0fa",fontWeight:600,fontSize:15,marginBottom:4}}>{p.concept}</div><StatusTag status={p.status}/></div>
                      <div style={{textAlign:"right"}}><div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:26,color:"#f0f0fa",lineHeight:1}}>{mxn(p.total)}</div><div style={{fontSize:11,color:"#555577",marginTop:2}}>total</div></div>
                    </div>
                    <ProgressBar value={p.paid} max={p.total}/>
                    <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:10,marginTop:14}}>
                      {[{label:"Pagado",value:mxn(p.paid),color:"#4ade80"},{label:"Restante",value:mxn(Math.max(0,p.total-p.paid)),color:"#f87171"}].map(item=>(
                        <div key={item.label} style={{background:"#0e0e18",borderRadius:8,padding:"10px 12px"}}><div style={{fontSize:10,color:"#555577",textTransform:"uppercase",letterSpacing:.7,marginBottom:4}}>{item.label}</div><div style={{fontWeight:600,color:item.color,fontSize:14}}>{item.value}</div></div>
                      ))}
                    </div>
                    {p.notes&&<div style={{marginTop:12,fontSize:12,color:"#7070a0",borderTop:"1px solid #1e1e2e",paddingTop:10}}>Nota: {p.notes}</div>}
                  </div>
                ))}
              </div>
              );
            })()}
          </div>
        )}

        {/* EVENTOS */}
        {tab==="events"&&(
          <div>
            <div className="section-title" style={{marginBottom:20}}>PRÓXIMOS EVENTOS</div>
            {events.length===0
              ?<div className="card empty-state" style={{padding:48}}><div className="empty-icon">📅</div><div>Sin eventos próximos</div></div>
              :events.map(ev=>{
                const et=EVENT_TYPE[ev.type]||EVENT_TYPE.otro;
                return(
                  <div key={ev.id} className="card" style={{padding:20,marginBottom:12,borderTop:`3px solid ${et.color}`}}>
                    <EventTypeBadge type={ev.type}/>
                    <div style={{fontWeight:600,color:"#f0f0fa",margin:"10px 0 6px",fontSize:14,lineHeight:1.4}}>{ev.title}</div>
                    <div style={{color:et.color,fontSize:13,fontWeight:500,marginBottom:4}}>📅 {fmtDate(ev.date)}</div>
                    {ev.place&&<div style={{color:"#666688",fontSize:12}}>📍 {ev.place}</div>}
                    {ev.desc&&<div style={{color:"#7070a0",fontSize:12,marginTop:6}}>{ev.desc}</div>}
                  </div>
                );
              })
            }
          </div>
        )}
      </div>

      {editPersonal&&(
        <Modal title="EDITAR MIS DATOS PERSONALES" onClose={()=>setEditPersonal(false)} lg>
          <StudentPersonalEdit student={student} api={api} onToast={showToast} onClose={()=>setEditPersonal(false)}/>
        </Modal>
      )}
      {showDuda&&<DudaModal student={student} api={api} onToast={showToast} onClose={()=>setShowDuda(false)}/>}
      {toast&&<Toast msg={toast} onDone={()=>setToast(null)}/>}
    </div>
  );
};

// ─── ROOT ─────────────────────────────────────────────────────────────────────
function App() {
  const [db,setDb]=useState(INIT_DB);
  const [session,setSession]=useState(null);
  const [loading,setLoading]=useState(false);
  const api=createApi(db,setDb);

  // Al salir se borra todo lo cargado, para que el siguiente usuario del mismo equipo no vea nada ajeno
  const logout = () => { _token = null; setDb(INIT_DB); setSession(null); };

  const loadApiData = async (tok, tok_id_instructor=null) => {
    try {
      const h = {"Content-Type":"application/json","Authorization":`Bearer ${tok}`};
      const fetchJ = (url) => fetch(API_URL+url,{headers:h}).then(r=>r.json());
      const safeGet = async (url) => { try { return await fetchJ(url); } catch(e) { return []; } };
      const [students, payments, exams, torneos, clases, equipo, instructores, lockers, sedesData, eventos] = await Promise.all([
        safeGet("/api/alumnos"),
        safeGet("/api/pagos"),
        safeGet("/api/examenes"),
        safeGet("/api/torneos"),
        safeGet("/api/clases"),
        safeGet("/api/equipo"),
        safeGet("/api/instructores"),
        Promise.resolve([]),
        safeGet("/api/sedes"),
        safeGet("/api/eventos"),
      ]);
      const mappedStudents = Array.isArray(students) ? students.map(a => ({
        id: a.num_control, name: a.nombre,
        dob: a.fecha_nacimiento ? a.fecha_nacimiento.split('T')[0] : "",
        age: a.fecha_nacimiento ? Math.floor((new Date()-new Date(a.fecha_nacimiento))/(365.25*24*60*60*1000)) : 0,
        belt: a.cinta_color||"Blanco", parent: a.responsable_nombre||"",
        phone: a.responsable_tel || "",
        email: a.email || "",
        joined: a.fecha_ingreso ? a.fecha_ingreso.split('T')[0] : todayStr(), active:true,
        user: a.num_control, pass:"1234", respId: a.num_control_responsable,
        usuarioLogin: a.usuario_login||a.num_control, parentesco: a.parentesco||"",
        claseId: a.id_clase ? String(a.id_clase) : null,
        claseNombre: a.clase_nombre || null,
        claseDias: a.clase_dias || null,
        claseHora: a.clase_hora_inicio && a.clase_hora_fin
          ? `${a.clase_hora_inicio.slice(0,5)} - ${a.clase_hora_fin.slice(0,5)}` : null,
        diaPago: a.dia_pago === 15 ? 15 : 1,
        personal:{
          address: a.direccion || "",
          blood: a.tipo_sangre || "",
          emergency: a.contacto_emergencia || "",
          emergencyPhone: a.tel_emergencia || "",
          medNotes: a.notas_medicas || ""
        }
      })) : [];
      const mappedPayments = Array.isArray(payments) ? payments.map(mapPago) : [];
      const mappedExams = Array.isArray(exams) ? exams.map(x => ({
        id: String(x.id_examen), sid: x.num_control_alumno,
        date: x.fecha ? x.fecha.split('T')[0] : todayStr(),
        fromBelt: "Blanco",
        toBelt: x.cinta_aspirada_color||"Amarillo",
        resultado: x.resultado||"Pendiente",
        passed: x.resultado==="Aprobado",
        notes: x.observaciones||"",
        nombre_examen: x.nombre_examen||"",
        sede: x.sede||""
      })) : [];
      const mappedTorneos = Array.isArray(torneos) ? torneos.map(t=>({
        id: String(t.id_torneo),
        nombre: t.nombre_torneo||"",
        sede: t.sede||"",
        fecha: t.fecha ? t.fecha.split('T')[0] : todayStr(),
      })) : [];

      const mappedClases = Array.isArray(clases) ? clases.map(c=>({
        id: String(c.id_clase),
        nombre: c.nombre||"Clase",
        dias: c.dia_semana||"",
        horaInicio: c.hora_inicio ? c.hora_inicio.slice(0,5) : "",
        horaFin: c.hora_fin ? c.hora_fin.slice(0,5) : "",
        instructorId: c.id_instructor ? String(c.id_instructor) : "1",
      })) : [];

      const mappedEquipo = Array.isArray(equipo) ? equipo.map(e=>({
        id: String(e.id_articulo),
        descripcion: e.descripcion||"",
        talla_modelo: e.talla_modelo||"",
        precio_unitario: parseFloat(e.precio_unitario)||0,
        stock: parseInt(e.stock)||0,
        stock_minimo: parseInt(e.stock_minimo)||2,
        prestamos: Array.isArray(e.prestamos) ? e.prestamos.map(p=>({
          id: String(p.id_prestamo),
          alumnoId: p.num_control_alumno,
          alumnoNombre: p.alumno_nombre||p.num_control_alumno,
          fecha: p.fecha_prestamo ? p.fecha_prestamo.split('T')[0] : todayStr(),
        })) : [],
      })) : [];

      const mappedInstructores = Array.isArray(instructores) ? instructores.map(i=>({
        id: String(i.id_instructor),
        nombre: i.nombre||"",
        cargo: i.cargo||"",
        grado_cinta: i.grado_cinta||"",
        email: i.email||"",
        telefono: i.telefono||"",
        username: i.username||"",
      })) : [];

      const mappedLockers = Array.isArray(lockers) ? lockers.map(l=>({
        id: String(l.id_locker),
        numero: l.numero_locker,
        color: l.color||"Gris",
        alumnoId: l.num_control_alumno||null,
        alumnoNombre: l.alumno_nombre||null,
        fechaAsignacion: l.fecha_asignacion ? l.fecha_asignacion.split('T')[0] : null,
      })) : [];

      // Set admin instructor data in db.admin
      const myInstr = mappedInstructores.find(i=>i.id===String(tok_id_instructor));
      // Siempre se reemplaza con lo del servidor (aunque venga vacío) para no mostrar datos de otra sesión
      setDb(prev=>({...prev,
        students: mappedStudents,
        payments: mappedPayments,
        exams: mappedExams,
        torneos: mappedTorneos,
        clases: mappedClases,
        equipo: mappedEquipo,
        instructores: mappedInstructores,
        lockers: mappedLockers,
        events: Array.isArray(eventos) ? eventos.map(mapEvento) : [],
        sedes: Array.isArray(sedesData) ? sedesData.map(s=>({
          id: String(s.id_sede), torneoId: String(s.id_torneo),
          nombre: s.nombre_sede||"", direccion: s.direccion||"",
          cupo_max: s.cupo_max||0, inscritos: s.inscritos||0
        })) : [],
        admin: myInstr ? {...prev.admin, cargo:myInstr.cargo, grado_cinta:myInstr.grado_cinta, phone:myInstr.telefono||prev.admin.phone, email:myInstr.email||prev.admin.email} : prev.admin,
      }));
    } catch(e){ console.log("Usando datos locales:",e); }
  };

  const handleLogin=useCallback(async (user,pass,isFirstLogin=false)=>{
    // La pantalla de carga solo aparece tras un login correcto: si se mostrara antes,
    // desmontaría el formulario y el mensaje de error se perdería
    setSession(null);
    // Tras entrar con la temporal ya hay token: se usa para fijar la contraseña nueva
    if(isFirstLogin){
      try { await api.cambiarPass(pass); }
      catch(e){ return {error: e.message}; }
    }
    const result=await api.login(user,pass);
    if(result && !result.error && !result.debeCambiar){
      setLoading(true);
      await loadApiData(_token, result.id_instructor||null);
      // Asegurar que id esté en la sesión
      const sessionWithId = {...result, id: result.id || user, displayName: result.nombre || result.name || user};
      // Update INIT_DB admin name with real nombre
      if (result.nombre) {
        setDb(prev => ({...prev, admin: {...prev.admin, name: result.nombre}}));
      }
      setSession(sessionWithId);
    }
    setLoading(false);
    return result;
  },[db]);

  if(loading) return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#0b0b12",flexDirection:"column",gap:16}}>
      <div style={{fontSize:40}}>🥋</div>
      <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:20,letterSpacing:3,color:"#c01212"}}>CARGANDO...</div>
      <div style={{color:"#555577",fontSize:13}}>Conectando con el servidor...</div>
    </div>
  );
  if(!session) return <LoginPage onLogin={handleLogin} db={db}/>;
  if(session.role==="admin"||session.role==="maestro") return <AdminLayout session={session} api={api} isMaestro={session.role==="maestro"} onLogout={logout}/>;
  return <StudentPortal session={session} api={api} onLogout={logout}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
