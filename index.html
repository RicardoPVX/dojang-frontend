<!DOCTYPE html>
<html lang="es">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dojang Taekwondo — Portal Académico</title>

  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body,#root{height:100%}
    body{background:#0b0b12;color:#dde0ee;font-family:'Exo 2',sans-serif;font-size:14px;line-height:1.6}

    .btn-blue{background:#1d4ed8;color:#fff}.btn-blue:hover{background:#2563eb}
    .btn-green{background:#166534;color:#fff}.btn-green:hover{background:#15803d}

    .modal{background:#13131e;border:1px solid #2a2a42;border-radius:12px;padding:26px;width:100%;max-width:500px;max-height:92vh;overflow-y:auto}

    .stat-label{font-size:11px;color:#666688;letter-spacing:.8px;text-transform:uppercase;margin-top:2px}
    table{width:100%;border-collapse:collapse}

    td{padding:11px 14px;border-bottom:1px solid #151520;color:#b0b0cc;font-size:13px;vertical-align:middle}
    tr:last-child td{border-bottom:none}
    tr:hover td{background:rgba(255,255,255,.02)}
    .belt-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
    .section-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1.5px;color:#f0f0fa}
    .empty-state{text-align:center;padding:48px 20px;color:#4a4a6a}

    .exam-timeline{position:relative;padding-left:32px}
    .exam-timeline::before{content:'';position:absolute;left:11px;top:0;bottom:0;width:2px;background:linear-gradient(to bottom,#c01212,#2a2a40);border-radius:2px}
    .exam-node{position:relative;margin-bottom:18px}
    .exam-node::before{content:'';position:absolute;left:-25px;top:14px;width:12px;height:12px;border-radius:50%;background:#c01212;border:2px solid #0b0b12;box-shadow:0 0 8px rgba(192,18,18,.6)}

    .inv-item-row:last-child{border-bottom:none}
    .stock-badge{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;font-family:'Bebas Neue',sans-serif;letter-spacing:.5px}
    .stock-ok{background:rgba(74,222,128,.15);color:#4ade80}

    .stock-out{background:rgba(239,68,68,.15);color:#f87171}
    .number-input-wrapper{display:flex;align-items:center;gap:4px}
    .qty-btn{width:26px;height:26px;border-radius:6px;border:1px solid #2a2a40;background:#14141e;color:#dde0ee;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;line-height:1;transition:all .12s}

    @keyframes slideOut{from{transform:translateY(0);opacity:1}to{transform:translateY(40px);opacity:0}}
    .toast{position:fixed;bottom:24px;right:24px;background:#13131e;border:1px solid #4ade8044;color:#4ade80;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:9999;animation:slideIn .3s ease}
    .toast-exit{animation:slideOut .3s ease forwards}

</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// ─── CONSTANTES ──────────────────────────────────────────────────────────────
// Sistema de grados Moo Duk Kwan, en orden. Los id son los de la tabla cintas.
const BELTS = [

  {name:"Verde Avanzado",id:10,grado:"6 Kup",bg:"#86efac",text:"#14532d",franja:"#1d4ed8"},

  {name:"Azul Avanzado",id:11,grado:"4 Kup",bg:"#93c5fd",text:"#1e3a8a",franja:"#6b3f1d"},
  {name:"Marrón",id:6,grado:"3 Kup",bg:"#b08968",text:"#3e2a14"},
  {name:"Marrón Avanzado",id:12,grado:"2 Kup",bg:"#b08968",text:"#3e2a14",franja:"#b91c1c"},
  {name:"Rojo",id:7,grado:"1 Kup",bg:"#fca5a5",text:"#7f1d1d"},
  {name:"Rojo Avanzado",id:13,grado:"Ieby Poom / Ieby Dan",bg:"#fca5a5",text:"#7f1d1d",franja:"#111111"},

const BELT_MAP = Object.fromEntries(BELTS.map(b=>[b.name,b]));
const BELT_LIST = BELTS.map(b=>b.name);
const BELT_ID = Object.fromEntries(BELTS.map(b=>[b.name,b.id]));
const beltLabel = (name) => BELT_MAP[name]?.grado ? `${name} · ${BELT_MAP[name].grado}` : name;
// Los grados avanzados llevan una franja del color del siguiente grado
const beltFondo = (b) => b.franja ? `linear-gradient(90deg,${b.bg} 70%,${b.franja} 70%)` : b.bg;
const STATUS = {
  en_proceso:{label:"En proceso",bg:"rgba(184,128,14,.15)",text:"#d4960f",bd:"rgba(184,128,14,.3)"},
  liquidado:{label:"Liquidado",bg:"rgba(34,197,94,.15)",text:"#4ade80",bd:"rgba(34,197,94,.3)"},
  vencido:{label:"Vencido",bg:"rgba(239,68,68,.15)",text:"#f87171",bd:"rgba(239,68,68,.3)"},
};
const EVENT_TYPE = {
  examen:{label:"Examen",color:"#d4960f"},
  torneo:{label:"Torneo",color:"#60a5fa"},
  fogueo:{label:"Fogueo",color:"#f87171"},
  otro:{label:"Otro",color:"#c084fc"},
};
// Las mensualidades empiezan a correr en esta fecha: antes no hay vencidos
const INICIO_MENSUALIDADES = new Date(2027,10,1);
const EXAM_MONTHS = 2;

// ─── INVENTARIO CATEGORÍAS ────────────────────────────────────────────────────
const INV_CATEGORIES = [
  {
    id:"uniformes", label:"Uniformes (Dobok)", icon:"👘",
    items:[
      {id:"dobok_xs",name:"Dobok Talla XS (Infantil)"},
      {id:"dobok_s",name:"Dobok Talla S"},
      {id:"dobok_m",name:"Dobok Talla M"},
      {id:"dobok_l",name:"Dobok Talla L"},
      {id:"dobok_xl",name:"Dobok Talla XL"},
      {id:"dobok_xxl",name:"Dobok Talla XXL"},
    ]
  },
  {
    id:"cintas", label:"Cintas de Cinturón", icon:"🎗️",
    items: BELT_LIST.map(b=>({id:`cinta_${b.toLowerCase()}`,name:`Cinta ${b}`}))
  },
  {
    id:"distintivos", label:"Distintivos de Cinturón", icon:"🏅",
    items:[
      {id:"dist_parche_club",name:"Parche del Club"},
      {id:"dist_bandera",name:"Parche Bandera México"},
      {id:"dist_nombre",name:"Distintivo de Nombre"},
      {id:"dist_grado",name:"Parche de Grado/Dan"},
      {id:"dist_competidor",name:"Parche Competidor"},
    ]
  },
  {
    id:"protectores", label:"Protectores de Combate", icon:"🛡️",
    items:[
      {id:"prot_empeinera_xs",name:"Empeinera XS"},
      {id:"prot_empeinera_s",name:"Empeinera S"},
      {id:"prot_empeinera_m",name:"Empeinera M"},
      {id:"prot_empeinera_l",name:"Empeinera L"},
      {id:"prot_espinillera_xs",name:"Espinillera XS"},
      {id:"prot_espinillera_s",name:"Espinillera S"},
      {id:"prot_espinillera_m",name:"Espinillera M"},
      {id:"prot_espinillera_l",name:"Espinillera L"},
      {id:"prot_peto_xs",name:"Peto (Hogu) XS"},
      {id:"prot_peto_s",name:"Peto (Hogu) S"},
      {id:"prot_peto_m",name:"Peto (Hogu) M"},
      {id:"prot_peto_l",name:"Peto (Hogu) L"},
      {id:"prot_guante_xs",name:"Guantes XS"},
      {id:"prot_guante_s",name:"Guantes S"},
      {id:"prot_guante_m",name:"Guantes M"},
      {id:"prot_guante_l",name:"Guantes L"},
      {id:"prot_antebracer_s",name:"Antebraceras S"},
      {id:"prot_antebracer_m",name:"Antebraceras M"},
      {id:"prot_antebracer_l",name:"Antebraceras L"},
      {id:"prot_casco_xs",name:"Casco XS"},
      {id:"prot_casco_s",name:"Casco S"},
      {id:"prot_casco_m",name:"Casco M"},
      {id:"prot_casco_l",name:"Casco L"},
      {id:"prot_bucal_u",name:"Protector Bucal (universal)"},
      {id:"prot_concha_s",name:"Concha (Prot. Zona Íntima) S"},
      {id:"prot_concha_m",name:"Concha (Prot. Zona Íntima) M"},
      {id:"prot_concha_l",name:"Concha (Prot. Zona Íntima) L"},
    ]
  },
];

// ─── BASE DE DATOS INICIAL ────────────────────────────────────────────────────
const buildInitInventory = () => {
  const inv = {};
  INV_CATEGORIES.forEach(cat => cat.items.forEach(item => {
    inv[item.id] = { qty: Math.floor(Math.random()*8)+1, minStock: 2 };
  }));
  return inv;
};

// Arranca vacío: todo se carga del backend al iniciar sesión (nada de datos de ejemplo)
const INIT_DB = {
  students:[],
  payments:[],
  events:[],
  exams:[],
  admin:{user:"admin",pass:"",name:"Administrador",email:"",phone:"",dojangName:"Dojang Taekwondo",address:""},
  torneos:[],
  sedes:[],
  clases:[],
  equipo:[],
  instructores:[],
  lockers:[],
  inventory: buildInitInventory(),
};

// ─── UTILIDADES ───────────────────────────────────────────────────────────────
let _seq = 0;
const uid = (p) => `${p}${Date.now()}${_seq++}`;
const genStudentId = (name, existingIds=[]) => {
  const year = new Date().getFullYear();
  const parts = name.trim().toUpperCase().split(/\s+/).filter(Boolean);
  const initials = parts.length >= 2
    ? parts[0][0] + parts[parts.length-1][0]
    : (parts[0]||"XX").slice(0,2);
  const base = `AT-${year}${initials}`;
  const taken = existingIds.filter(id=>id.startsWith(base)).map(id=>parseInt(id.slice(-3))||0);
  const next = taken.length ? Math.max(...taken)+1 : 1;
  return `${base}${String(next).padStart(3,"0")}`;
};
const todayStr = () => new Date().toISOString().split("T")[0];
const parseDate = (s) => new Date(s + "T12:00:00");
const fmtDate = (d) => {
  if(!d) return "—";
  const [y,m,day] = d.split("-");
  return `${parseInt(day)} ${["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"][+m-1]} ${y}`;
};
const mxn = (n) => `$${Number(n).toLocaleString("es-MX")}`;
function monthsBetween(d1,d2){const a=parseDate(d1),b=parseDate(d2);return(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth())}
function addMonths(dateStr,n){if(!dateStr)return todayStr();const d=parseDate(dateStr);if(isNaN(d.getTime()))return todayStr();d.setMonth(d.getMonth()+n);return d.toISOString().split("T")[0]}
function daysUntil(dateStr){const t=parseDate(todayStr()),tgt=parseDate(dateStr);return Math.round((tgt-t)/(1000*60*60*24))}

// ─── TOAST ────────────────────────────────────────────────────────────────────
const Toast = ({msg,onDone}) => {
  const [exiting,setExiting] = useState(false);
  useEffect(()=>{
    const t1 = setTimeout(()=>setExiting(true),2200);
    const t2 = setTimeout(()=>onDone(),2600);
    return ()=>{clearTimeout(t1);clearTimeout(t2)};
  },[]);
  return <div className={`toast ${exiting?"toast-exit":""}`}>✓ {msg}</div>;
};

// ─── API REAL (conectada a backend) ───────────────────────────────────────────
// Abierto en tu PC (localhost) usa el backend local; en Vercel usa Render
const API_URL = ["localhost","127.0.0.1"].includes(location.hostname)
  ? "http://localhost:3001"
  : "https://dojang-backend-niwf.onrender.com";
let _token = null;

async function apiFetch(path, options={}) {
  const headers = {"Content-Type":"application/json"};
  if(_token) headers["Authorization"] = `Bearer ${_token}`;
  const res = await fetch(API_URL + path, {...options, headers});
  const data = await res.json().catch(()=>({}));
  if(!res.ok) {
    const err = new Error(data.error || `HTTP ${res.status}`);
    err.status = res.status;
    throw err;
  }
  return data;
}

// sid es el responsable: en la base los pagos son de la familia, no del alumno
const mapPago = (p) => {
  const total = parseFloat(p.monto_total)||0;
  const cuotas = p.num_cuotas||1;
  return {
    id: String(p.id_pago), sid: p.num_control_responsable,
    concept: p.tipo_pago||"Pago", total, paid: parseFloat(p.monto_abonado)||0,
    installments: cuotas, instPaid: p.cuotas_pagadas||0,
    instAmt: parseFloat(p.monto_cuota)||Math.round(total/cuotas*100)/100,
    start: p.fecha_pago ? String(p.fecha_pago).split("T")[0] : todayStr(),
    nextDue: p.proximo_vencimiento ? String(p.proximo_vencimiento).split("T")[0] : null,
    status: p.estado_pago==="Liquidado"?"liquidado":p.estado_pago==="Vencido"?"vencido":"en_proceso",
    notes: p.notas||"",
    alumnoId: p.num_control_alumno||null,
    tutorNombre: p.responsable_nombre||"",
    mesPagado: parseInt(p.mes_correspondiente)||null,
    anioPagado: p.anio_correspondiente||null
  };
};
// Cada pago es de un alumno; los antiguos sin alumno se identifican por su tutor
const pagoEsDe = (p, s) => p.alumnoId ? p.alumnoId===s.id : p.sid===s.respId;
const nombreDePago = (p, students) => students.find(s=>pagoEsDe(p,s))?.name || (p.tutorNombre ? `Baja (tutor: ${p.tutorNombre})` : "—");
// Una mensualidad cuenta para el mes que se pagó, no para la fecha en que se registró
// (la de mayo pagada el 1 de junio es de mayo). Sin ese dato se usa la fecha.
const esMensualidadDe = (p, mes, anio) => {
  if(p.concept!=="Mensualidad") return false;
  if(p.mesPagado) return p.mesPagado===mes+1 && p.anioPagado===anio;
  const d = parseDate(p.start);
  return d.getMonth()===mes && d.getFullYear()===anio;
};
const pagoBody = (d, respId) => JSON.stringify({
  monto_total: d.total,
  monto_abonado: d.paid||0,
  fecha_pago: d.start,
  metodo_pago: "A plazos",
  num_control_alumno: d.sid||null,
  tipo_pago: d.concept,
  estado_pago: d.status==="liquidado"?"Liquidado":d.status==="vencido"?"Vencido":"Pendiente",
  num_control_responsable: respId,
  num_cuotas: d.installments||1,
  cuotas_pagadas: d.instPaid||0,
  monto_cuota: d.instAmt||null,
  proximo_vencimiento: d.nextDue||null,
  notas: d.notes||""
});

const mapEvento = (e) => ({
  id: String(e.id_evento), title: e.titulo||"", type: e.tipo||"otro",
  date: e.fecha ? String(e.fecha).split("T")[0] : "", desc: e.descripcion||"", place: e.lugar||""
});

// La contraseña temporal solo se muestra esta vez; el cuadro permite copiarla
const mostrarAcceso = (id, pass) => {
  window.prompt(`Acceso de la familia. ID: ${id}\nCopia y entrega esta contraseña temporal; no se volverá a mostrar:`, pass);
};

function createApi(db, setDb) {
  const mutate = (fn) => setDb(prev => ({...prev,...fn(prev)}));
  return {
    // ── LOGIN (usa API real) ──
    login: async (user, pass) => {
      try {
        const data = await apiFetch("/api/auth/login", {
          method:"POST",
          body: JSON.stringify({username:user, password:pass})
        });
        if(data.token) {
          _token = data.token;
          return {role: data.rol === "admin" ? "admin" : ((data.rol === "instructor" || data.rol === "maestro") ? "maestro" : data.rol), name: data.username, id: data.username, id_instructor: data.id_instructor, nombre: data.nombre, debeCambiar: !!data.debe_cambiar};

    pagarMensualidad: async (student, checked, mes, anio, fecha) => {
      const respId = student.respId || `RESP-${student.id}`;
      const existing = db.payments.find(p => {
        if (!pagoEsDe(p, student)) return false;
        return esMensualidadDe(p, mes, anio);
      });
      if (checked && !existing) {
        try {
          const fechaPago = fecha || todayStr();
          const resp = await apiFetch("/api/pagos", {method:"POST", body: JSON.stringify({
            monto_total: 500, monto_abonado: 500,
            tipo_pago: "Mensualidad", metodo_pago: "Contado",
            estado_pago: "Liquidado",
            fecha_pago: fechaPago,
            num_control_responsable: respId,
            num_control_alumno: student.id,
            mes_correspondiente: mes + 1,
            anio: anio
          })});
          if (resp?.id_pago) {
            mutate(db=>({payments:[...db.payments,{
              id: String(resp.id_pago), sid: respId,
              concept:"Mensualidad", total:500, paid:500,
              installments:1, instPaid:1, instAmt:500,
              start: fechaPago, nextDue:null, status:"liquidado", notes:"",
              mesPagado: mes+1, anioPagado: anio, alumnoId: student.id
            }]}));
          }
        } catch(e){ alert(`No se pudo registrar la mensualidad: ${e.message}`); }
      } else if (!checked && existing) {
        try {
          await apiFetch(`/api/pagos/${existing.id}`, {method:"DELETE"});
          mutate(db=>({payments:db.payments.filter(p=>p.id!==existing.id)}));
        } catch(e){ alert(`No se pudo quitar la mensualidad: ${e.message}`); }
      }

                id_torneo: resp.id_torneo, nombre_sede: d.sede, cupo_max: 0
              })});
              if(respSede?.id_sede){
                mutate(db=>({sedes:[...(db.sedes||[]),{
                  id:String(respSede.id_sede), torneoId,
                  nombre:d.sede, direccion:"", cupo_max:0, inscritos:0
                }]}));
              }
            } catch(e2){ console.error("Error creando sede:",e2); }
          }
          return;
        }
      } catch(e){ console.error(e); }
    },
    updateTorneo: async (id,d) => {
      try {
        await apiFetch(`/api/torneos/${id}`, {method:"PUT", body: JSON.stringify({
          nombre_torneo: d.nombre, sede: d.sede, fecha: d.fecha
        })});
      } catch(e){ console.error(e); }
      mutate(db=>({torneos:db.torneos.map(t=>t.id===id?{...t,...d}:t)}));
    },
    deleteTorneo: async (id) => {
      try { await apiFetch(`/api/torneos/${id}`, {method:"DELETE"}); } catch(e){ console.error(e); }
      mutate(db=>({torneos:db.torneos.filter(t=>t.id!==id), sedes:db.sedes.filter(s=>s.torneoId!==id)}));
    },
    getSedes: () => db.sedes,
    getSedesByTorneo: (torneoId) => (db.sedes||[]).filter(s=>s.torneoId===String(torneoId)),
    addSede: async (d) => {
      try {
        const resp = await apiFetch("/api/sedes", {method:"POST", body: JSON.stringify({
          id_torneo: d.torneoId, nombre_sede: d.nombre, direccion: d.direccion||null, cupo_max: d.cupo_max||0
        })});
        if(resp?.id_sede){
          mutate(db=>({sedes:[...(db.sedes||[]),{id:String(resp.id_sede),torneoId:String(d.torneoId),nombre:d.nombre,direccion:d.direccion||"",cupo_max:d.cupo_max||0,inscritos:0}]}));
        }
      } catch(e){ console.error(e); }
    },
    deleteSede: async (id) => {
      try { await apiFetch(`/api/sedes/${id}`, {method:"DELETE"}); } catch(e){ console.error(e); }
      mutate(db=>({sedes:(db.sedes||[]).filter(s=>s.id!==id)}));
    },
    inscribirSede: async (sedeId, alumnoId) => {
      try {
        await apiFetch(`/api/sedes/${sedeId}/inscribir`, {method:"POST", body: JSON.stringify({num_control_alumno:alumnoId})});
        mutate(db=>({sedes:(db.sedes||[]).map(s=>s.id===String(sedeId)?{...s,inscritos:(s.inscritos||0)+1}:s)}));
      } catch(e){ console.error(e); }
    },
    // ── EXÁMENES GLOBAL ──
    getAllExamsFlat: () => db.exams.slice().sort((a,b)=>b.date.localeCompare(a.date)),
    getFutureExams: () => db.exams.filter(x=>!x.sid).sort((a,b)=>a.date.localeCompare(b.date)),
    addFutureExam: async (d) => {
      try {
        const resp = await apiFetch("/api/examenes", {method:"POST", body: JSON.stringify({
          fecha: d.fecha, nombre_examen: d.nombre_examen, sede: d.sede, resultado:"Pendiente"
        })});
        if(resp?.id_examen){
          mutate(db=>({exams:[...db.exams,{id:String(resp.id_examen),sid:null,date:d.fecha,nombre_examen:d.nombre_examen,sede:d.sede,resultado:"Pendiente",passed:false,notes:"",fromBelt:"Blanco",toBelt:"Blanco"}]}));
          return;
        }
      } catch(e){ console.error(e); }
    },
    deleteFutureExam: async (id) => {
      try { await apiFetch(`/api/examenes/${id}`, {method:"DELETE"}); } catch(e){ console.error(e); }
      mutate(db=>({exams:db.exams.filter(x=>x.id!==id)}));
    },
    updateFutureExam: async (id,d) => {
      try {
        await apiFetch(`/api/examenes/${id}`, {method:"PUT", body: JSON.stringify({
          fecha: d.fecha, nombre_examen: d.nombre_examen, sede: d.sede
        })});
      } catch(e){ console.error(e); }
      mutate(db=>({exams:db.exams.map(x=>x.id===id?{...x,...d,date:d.fecha||x.date}:x)}));
    },
    // ── INVENTARIO (legacy local) ──
    getInventory: () => db.inventory,
    updateInventoryItem:(itemId,data)=>mutate(db=>({inventory:{...db.inventory,[itemId]:{...db.inventory[itemId],...data}}})),
    // ── LOCKERS (API real) ──
    getLockers: () => db.lockers,
    fetchLockers: async () => {
      try {
        const data = await apiFetch("/api/lockers");
        const mapped = data.map(l=>({
          id: String(l.id_locker),
          numero: l.numero_locker,
          color: l.color||"Gris",
          alumnoId: l.num_control_alumno||null,
          alumnoNombre: l.alumno_nombre||null,
          fechaAsignacion: l.fecha_asignacion ? l.fecha_asignacion.split('T')[0] : null,
        }));
        mutate(()=>({lockers: mapped}));
        return mapped;
      } catch(e){ return db.lockers; }
    },
    addLocker: async (d) => {
      try {
        const resp = await apiFetch("/api/lockers", {method:"POST", body: JSON.stringify({numero_locker: d.numero, color: d.color})});
        if(resp?.id_locker){
          mutate(db=>({lockers:[...db.lockers,{id:String(resp.id_locker),numero:d.numero,color:d.color||"Gris",alumnoId:null,alumnoNombre:null,fechaAsignacion:null}]}));
          return true;
        }
      } catch(e){ console.error(e); }
      return false;
    },
    deleteLocker: async (id) => {
      try { await apiFetch(`/api/lockers/${id}`, {method:"DELETE"}); } catch(e){ console.error(e); }
      mutate(db=>({lockers: db.lockers.filter(l=>l.id!==id)}));
    },
    asignarLocker: async (lockerId, alumnoId) => {
      try {
        const resp = await apiFetch(`/api/lockers/${lockerId}/asignar`, {method:"PUT", body: JSON.stringify({num_control_alumno: alumnoId})});
        if(resp?.id_locker){
          const alumnoNombre = db.students.find(s=>s.id===alumnoId)?.name||null;
          mutate(db=>({lockers: db.lockers.map(l=>l.id===lockerId ? {...l,alumnoId,alumnoNombre,fechaAsignacion:todayStr()} : l.alumnoId===alumnoId ? {...l,alumnoId:null,alumnoNombre:null,fechaAsignacion:null} : l)}));
          return true;
        }
      } catch(e){ console.error(e); }
      return false;
    },
    liberarLocker: async (lockerId) => {
      try { await apiFetch(`/api/lockers/${lockerId}/liberar`, {method:"PUT"}); } catch(e){ console.error(e); }
      mutate(db=>({lockers: db.lockers.map(l=>l.id===lockerId?{...l,alumnoId:null,alumnoNombre:null,fechaAsignacion:null}:l)}));
    },
  };
}

const BeltBadge = ({belt}) => {
  const b = BELT_MAP[belt]||BELT_MAP.Blanco;
  return <span className="belt-badge" style={{background:beltFondo(b),color:b.text}}><span>◼</span>{belt}</span>;
};
const StatusTag = ({status}) => {
  const s = STATUS[status]||STATUS.en_proceso;
  return <span className="tag" style={{background:s.bg,color:s.text,border:`1px solid ${s.bd}`}}>{s.label}</span>;
};
const EventTypeBadge = ({type}) => {
  const e = EVENT_TYPE[type]||EVENT_TYPE.otro;
  return <span className="tag" style={{background:`${e.color}22`,color:e.color,border:`1px solid ${e.color}44`}}>{e.label}</span>;
};
const ProgressBar = ({value,max}) => {
  const pct = max?Math.min(100,(value/max)*100):0;
  const color = pct>=100?"#4ade80":pct>=50?"#d4960f":"#c01212";
  return <div className="progress-bar"><div className="progress-fill" style={{width:`${pct}%`,background:color}} /></div>;
};

// ─── EXAM TIMELINE ────────────────────────────────────────────────────────────
const ExamTimeline = ({exams}) => {
  if(exams.length===0) return <div className="card empty-state" style={{padding:48}}><div className="empty-icon">🎓</div><div>Sin exámenes registrados</div><div style={{fontSize:12,marginTop:8,color:"#333355"}}>Tu historial aparecerá aquí.</div></div>;
  return(
    <div className="exam-timeline">
      {exams.map((exam,i)=>{
        const prev = i>0?exams[i-1].date:null;
        const months = prev?monthsBetween(prev,exam.date):null;
        const bm = BELT_MAP[exam.toBelt]||BELT_MAP.Blanco;
        return(
          <div key={exam.id} className="exam-node">
            {months!==null&&<div style={{display:"flex",alignItems:"center",gap:6,marginBottom:8}}><div style={{height:1,flex:1,background:"#1e1e2e",maxWidth:60}}/><span style={{fontSize:10,color:"#555577",background:"#0e0e18",border:"1px solid #1e1e2e",padding:"2px 8px",borderRadius:20,whiteSpace:"nowrap"}}>{months} mes{months!==1?"es":""} después</span><div style={{height:1,flex:1,background:"#1e1e2e",maxWidth:20}}/></div>}
            <div className="card" style={{padding:"14px 18px",borderLeft:`3px solid ${exam.passed?bm.bg:"#7f1d1d"}`,opacity:exam.passed?1:0.82}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10}}>
                <div style={{flex:1}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6,flexWrap:"wrap"}}>
                    <span style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:15,letterSpacing:1,color:"#f0f0fa"}}>Examen #{i+1}</span>
                    {exam.passed?<span className="tag" style={{background:"rgba(74,222,128,.15)",color:"#4ade80",border:"1px solid rgba(74,222,128,.3)"}}>✓ Aprobado</span>:<span className="tag" style={{background:"rgba(239,68,68,.15)",color:"#f87171",border:"1px solid rgba(239,68,68,.3)"}}>✗ No aprobado</span>}
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                    <BeltBadge belt={exam.fromBelt}/><span style={{color:"#555577",fontSize:12}}>→</span><BeltBadge belt={exam.toBelt}/>
                  </div>
                  {exam.notes&&<div style={{marginTop:8,fontSize:12,color:"#7070a0",fontStyle:"italic"}}>"{exam.notes}"</div>}
                </div>
                <div style={{textAlign:"right",flexShrink:0}}>
                  <div style={{color:"#dde0ee",fontSize:13,fontWeight:500}}>{fmtDate(exam.date)}</div>
                  {months!==null&&<div style={{fontSize:11,color:"#555577",marginTop:2}}>+{months} mes{months!==1?"es":""}</div>}
                </div>
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
};

// ─── EXAM FORM ────────────────────────────────────────────────────────────────
const ExamForm = ({initial,sid,onSave,onClose}) => {
  const empty = {sid:sid||"",date:todayStr(),fromBelt:"Blanco",toBelt:"Amarillo",resultado:"Pendiente",notes:"",nombre_examen:"",sede:""};
  const [f,setF] = useState(initial?{...initial, resultado:initial.resultado||(initial.passed?"Aprobado":"Pendiente")}:empty);
  const set = (k,v)=>setF(p=>({...p,[k]:v}));
  const submit = (e)=>{e.preventDefault();onSave({...f,passed:f.resultado==="Aprobado"});onClose();};
  return(
    <form onSubmit={submit}>
      <div className="form-row form-row-2">
        <div><label className="tk-label">Nombre del examen</label><input className="tk-input" value={f.nombre_examen} onChange={e=>set("nombre_examen",e.target.value)} placeholder="Ej. Examen Cinturones Blancos"/></div>
        <div><label className="tk-label">Sede</label><input className="tk-input" value={f.sede} onChange={e=>set("sede",e.target.value)} placeholder="Ej. Dojang Principal"/></div>
      </div>
      <div className="form-row form-row-2">
        <div><label className="tk-label">Cinturón anterior</label><select className="tk-input" value={f.fromBelt} onChange={e=>set("fromBelt",e.target.value)}>{BELT_LIST.map(b=><option key={b} value={b}>{beltLabel(b)}</option>)}</select></div>
        <div><label className="tk-label">Cinturón objetivo</label><select className="tk-input" value={f.toBelt} onChange={e=>set("toBelt",e.target.value)}>{BELT_LIST.map(b=><option key={b} value={b}>{beltLabel(b)}</option>)}</select></div>
      </div>
      <div className="form-row form-row-2">
        <div><label className="tk-label">Fecha del examen</label><input className="tk-input" type="date" required value={f.date} onChange={e=>set("date",e.target.value)}/></div>
        <div><label className="tk-label">Resultado</label><select className="tk-input" value={f.resultado} onChange={e=>set("resultado",e.target.value)}>
          <option value="Pendiente">⏳ Pendiente</option>
          <option value="Aprobado">✓ Aprobado</option>
          <option value="Reprobado">✗ No aprobado</option>
        </select></div>
      </div>
      <div className="form-row"><div><label className="tk-label">Observaciones del maestro</label><textarea className="tk-input" rows={2} value={f.notes} onChange={e=>set("notes",e.target.value)} placeholder="Ej. Excelente poomsae, mejorar velocidad..."/></div></div>
      <div className="form-actions">
        <button type="button" className="tk-btn btn-ghost" onClick={onClose}>Cancelar</button>
        <button type="submit" className="tk-btn btn-red">Guardar examen</button>
      </div>
    </form>
  );
};

// ─── LOGIN — FLUJO 3 PASOS ────────────────────────────────────────────────────
// Lookup table: id numérico → {user, role, periodo}
const ID_LOOKUP = {
  "0001": {user:"admin", role:"admin", nombre:"Administrador", periodo:""},
};

const ROLE_LABELS = {admin:"Administrador", alumno:"Alumno", maestro:"Instructor", representante:"Representante", usuario:"Usuario"};
const ROLE_COLORS = {admin:"#c01212", alumno:"#1d4ed8", maestro:"#b8800e", representante:"#166534", usuario:"#555577"};

const LoginPage = ({onLogin, db}) => {
  const [step, setStep]     = useState(1);   // 1=ID, 2=confirm, 3=pass
  const [idVal, setIdVal]   = useState("");
  const [found, setFound]   = useState(null);
  const [pass, setPass]     = useState("");
  const [newPass, setNewPass] = useState("");
  const [newPass2, setNewPass2] = useState("");
  const [showPass, setShowPass] = useState(false);
  const [err, setErr]       = useState("");
  const [shake, setShake]   = useState(false);
  const idRef  = useRef(null);
  const passRef = useRef(null);

  const triggerShake = () => {
    setShake(true);
    setTimeout(()=>setShake(false), 500);
  };

  const handleIdSubmit = async (e) => {
    e.preventDefault();
    const trimmed = idVal.trim();
    // No se consultan listas públicas de alumnos ni maestros: el ID se valida junto con la contraseña
    const match = ID_LOOKUP[trimmed] || {user: trimmed, role: "usuario", nombre: trimmed, periodo: ""};
    setFound(match);
    setErr("");
    setStep(2);
    setTimeout(()=>passRef.current?.focus(), 350);
  };

  const handlePassSubmit = async (e) => {
    e.preventDefault();
    const result = await onLogin(found.user, pass);
    if (!result || result.error) {
      triggerShake();
      setErr(result?.error || "ID o contraseña incorrectos.");
    } else if (result.debeCambiar) {
      setErr("");
      setStep(3);
    }
  };

  const resetFlow = () => {
    setStep(1); setIdVal(""); setFound(null); setPass(""); setErr("");
    setTimeout(()=>idRef.current?.focus(), 100);
  };

  const roleColor = found ? (ROLE_COLORS[found.role]||"#555577") : "#c01212";
  const roleLabel = found ? (ROLE_LABELS[found.role]||found.role) : "";

  return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20,position:"relative",overflow:"hidden",background:"#0b0b12"}}>
      {/* Fondo decorativo */}
      <div style={{position:"absolute",top:"-15%",right:"-8%",width:560,height:560,borderRadius:"50%",background:"radial-gradient(circle,rgba(192,18,18,.07) 0%,transparent 68%)",pointerEvents:"none"}}/>
      <div style={{position:"absolute",bottom:"-18%",left:"-8%",width:480,height:480,borderRadius:"50%",background:"radial-gradient(circle,rgba(184,128,14,.05) 0%,transparent 68%)",pointerEvents:"none"}}/>
      {/* Líneas decorativas diagonales */}
      <svg style={{position:"absolute",inset:0,width:"100%",height:"100%",pointerEvents:"none",opacity:.04}} xmlns="http://www.w3.org/2000/svg">
        {[...Array(8)].map((_,i)=><line key={i} x1={i*160-200} y1="0" x2={i*160+400} y2="100%" stroke="#c01212" strokeWidth="1"/>)}
      </svg>

      <div style={{width:"100%",maxWidth:400,position:"relative",zIndex:1}}>
        {/* Logo */}
        <div style={{textAlign:"center",marginBottom:36}}>
          <div style={{width:70,height:70,borderRadius:"50%",background:"rgba(192,18,18,.12)",border:"2px solid rgba(192,18,18,.35)",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 14px",fontSize:30,boxShadow:"0 0 32px rgba(192,18,18,.15)"}}>🥋</div>
          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:30,letterSpacing:3,color:"#f0f0fa",lineHeight:1}}>DOJANG TAEKWONDO</div>
          <div style={{fontSize:11,color:"#444466",letterSpacing:2.5,textTransform:"uppercase",marginTop:5}}>Portal Académico</div>
        </div>

        {/* Indicador de pasos */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:0,marginBottom:28}}>
          {[1,2,3].map((s,i)=>{
            const done = step > s;
            const active = step === s;
            const color = done||active ? "#c01212" : "#222234";
            const textColor = done||active ? "#fff" : "#333355";
            return (
              <React.Fragment key={s}>
                <div style={{width:28,height:28,borderRadius:"50%",background:color,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,color:textColor,border:`2px solid ${done||active?"#c01212":"#1e1e2e"}`,transition:"all .3s",boxShadow:active?"0 0 12px rgba(192,18,18,.5)":"none"}}>
                  {done ? "✓" : s}
                </div>
                {i<2 && <div style={{width:48,height:2,background:done?"#c01212":"#1a1a2a",transition:"background .3s"}}/>}
              </React.Fragment>
            );
          })}
        </div>

        {/* PASO 1 — Ingresar ID */}
        {step===1 && (
          <div style={{animation:"fadeSlideIn .3s ease"}}>
            <div style={{marginBottom:6,textAlign:"center"}}>
              <div style={{fontSize:13,color:"#888899",marginBottom:2}}>Paso 1 de 3</div>
              <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:20,letterSpacing:1.5,color:"#f0f0fa"}}>Ingresa tu ID</div>
            </div>
            <form onSubmit={handleIdSubmit} className="card" style={{padding:26,marginTop:16,animation:shake?"shakeAnim .4s ease":"none"}}>
              <div className="form-row">
                <div>
                  <label className="tk-label">Número de identificación</label>
                  <input
                    ref={idRef}
                    autoFocus
                    className="tk-input"
                    value={idVal}
                    onChange={e=>{setIdVal(e.target.value);setErr("");}}
                    placeholder="Ej. AT-2026YL001"
                    style={{fontSize:22,letterSpacing:4,textAlign:"center",fontFamily:"'Bebas Neue',sans-serif",padding:"12px"}}
                    maxLength={20}
                  />
                  {err && <div style={{color:"#f87171",fontSize:12,marginTop:8,display:"flex",alignItems:"center",gap:6}}><span>⚠</span>{err}</div>}
                  <div style={{fontSize:11,color:"#333355",marginTop:8,textAlign:"center"}}>Solo tú conoces tu ID. No lo compartas.</div>
                </div>
              </div>
              <button className="tk-btn btn-red" style={{width:"100%",justifyContent:"center",padding:"11px 0",fontSize:14,marginTop:4}} type="submit" disabled={!idVal.trim()}>
                Continuar →
              </button>
            </form>
          </div>
        )}

        {/* PASO 2 — Confirmar identidad */}
        {step===2 && found && (
          <div style={{animation:"fadeSlideIn .3s ease"}}>
            <div style={{marginBottom:6,textAlign:"center"}}>
              <div style={{fontSize:13,color:"#888899",marginBottom:2}}>Paso 2 de 3</div>
              <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:20,letterSpacing:1.5,color:"#f0f0fa"}}>Confirma tu identidad</div>
            </div>
            <div className="card" style={{padding:24,marginTop:16}}>
              {/* Tarjeta de identidad */}
              <div style={{background:"linear-gradient(135deg,rgba(192,18,18,.12),rgba(11,11,18,.8))",border:`1px solid ${roleColor}44`,borderRadius:10,padding:"18px 20px",marginBottom:20,position:"relative",overflow:"hidden"}}>
                <div style={{position:"absolute",top:-20,right:-20,width:80,height:80,borderRadius:"50%",background:`${roleColor}18`,pointerEvents:"none"}}/>
                <div style={{display:"flex",alignItems:"center",gap:14}}>
                  <div style={{width:46,height:46,borderRadius:"50%",background:`${roleColor}20`,border:`2px solid ${roleColor}60`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}}>
                    {found.role==="admin"?"🛡️":found.role==="alumno"?"🥋":found.role==="maestro"?"👨‍🏫":"👤"}
                  </div>
                  <div style={{flex:1}}>
                    <div style={{color:"#f0f0fa",fontWeight:600,fontSize:16,marginBottom:2}}>{found.nombre}</div>
                    <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                      <span style={{fontSize:11,fontWeight:700,color:roleColor,background:`${roleColor}18`,border:`1px solid ${roleColor}40`,borderRadius:20,padding:"2px 9px",letterSpacing:.5,textTransform:"uppercase"}}>{roleLabel}</span>
                      {found.periodo && <span style={{fontSize:11,color:"#555577"}}>Periodo: <span style={{color:"#9090b0"}}>{found.periodo}</span></span>}
                    </div>
                  </div>
                </div>
              </div>
              {/* Paso a contraseña */}
              <form onSubmit={handlePassSubmit}>
                <div>
                  <label className="tk-label">Contraseña</label>
                  <div style={{position:"relative"}}>
                    <input
                      ref={passRef}
                      className="tk-input"
                      type={showPass?"text":"password"}
                      value={pass}
                      onChange={e=>{setPass(e.target.value);setErr("");}}
                      placeholder="••••••"
                      style={{paddingRight:72,animation:shake?"shakeAnim .4s ease":"none"}}
                    />
                    <button type="button" onClick={()=>setShowPass(p=>!p)} style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:"#555577",cursor:"pointer",fontSize:11,fontFamily:"'Exo 2',sans-serif",padding:"4px"}}>
                      {showPass?"Ocultar":"Mostrar"}
                    </button>
                  </div>
                  {err && <div style={{color:"#f87171",fontSize:12,marginTop:8,display:"flex",alignItems:"center",gap:6}}><span>⚠</span>{err}</div>}
                </div>
                <div style={{display:"flex",gap:10,marginTop:18}}>
                  <button type="button" className="tk-btn btn-ghost" style={{flex:1,justifyContent:"center"}} onClick={resetFlow}>← Atrás</button>
                  <button type="submit" className="tk-btn btn-red" style={{flex:2,justifyContent:"center",padding:"10px 0"}} disabled={!pass}>Entrar</button>
                </div>
              </form>
            </div>
          </div>
        )}

        {step===3&&(
        <div className="card" style={{padding:26,marginTop:16}}>
          <div style={{marginBottom:16,color:"#9090b0",fontSize:13,textAlign:"center"}}>
            Es tu primer acceso. Elige tu contraseña para continuar; este acceso no se puede volver a usar.
          </div>
          <div style={{marginBottom:12}}>
            <label className="tk-label">Nueva contraseña</label>
            <input className="tk-input" type="password" value={newPass}
              onChange={e=>setNewPass(e.target.value)} placeholder="Mínimo 6 caracteres"/>
          </div>
          <div style={{marginBottom:16}}>
            <label className="tk-label">Confirmar contraseña</label>
            <input className="tk-input" type="password" value={newPass2}
              onChange={e=>setNewPass2(e.target.value)} placeholder="Repite la contraseña"/>
          </div>
          {newPass&&newPass2&&newPass!==newPass2&&<div style={{color:"#f87171",fontSize:12,marginBottom:8}}>⚠ Las contraseñas no coinciden</div>}
          <button className="tk-btn btn-red" style={{width:"100%",justifyContent:"center",padding:"11px 0",fontSize:14}}
            disabled={newPass.length<6||newPass!==newPass2}
            onClick={async()=>{
              const result = await onLogin(found.user, newPass, true);
              if(!result || result.error){ setErr(result?.error || "Error al crear contraseña."); setStep(2); }
            }}>
            Crear contraseña y entrar →
          </button>
        </div>
        )}


      </div>

      <style>{`
        @keyframes fadeSlideIn {
          from { opacity:0; transform:translateY(12px); }
          to   { opacity:1; transform:translateY(0); }
        }
        @keyframes shakeAnim {
          0%,100% { transform:translateX(0); }
          20%     { transform:translateX(-8px); }
          40%     { transform:translateX(8px); }
          60%     { transform:translateX(-6px); }
          80%     { transform:translateX(6px); }
        }
      `}</style>
    </div>
  );
};

// ─── STUDENT FORM ─────────────────────────────────────────────────────────────
const StudentForm = ({initial,onSave,onClose,api}) => {
  const empty={name:"",dob:"",belt:"Blanco",parent:"",phone:"",email:"",joined:todayStr(),active:true,user:"",claseId:"",diaPago:1,personal:{address:"",blood:"",emergency:"",emergencyPhone:"",medNotes:""}};
  const [f,setF] = useState(initial||empty);
  const set = (k,v)=>setF(p=>({...p,[k]:v}));
  const setP = (k,v)=>setF(p=>({...p,personal:{...p.personal,[k]:v}}));
  const tutoresExistentes = api ? [...new Map(api.getStudents().map(s=>[s.respId,s])).values()].sort((a,b)=>(a.parent||"").localeCompare(b.parent||"")) : [];
  const handleName = (v) => {
    const existingIds = api ? api.getStudents().map(s=>s.id) : [];
    const newId = v.trim().length>=2 ? genStudentId(v, existingIds) : "";
    setF(p=>({...p, name:v, user: initial ? p.user : newId}));
  };
  const submit = async (e)=>{e.preventDefault();if(await onSave({...f,id:f.user}))onClose();};
  return(
    <form onSubmit={submit}>
      <div style={{fontSize:11,color:"#c01212",textTransform:"uppercase",letterSpacing:.8,marginBottom:12}}>Datos del alumno</div>
      <div className="form-row form-row-2">
        <div><label className="tk-label">Nombre completo</label><input className="tk-input" required value={f.name} onChange={e=>handleName(e.target.value)}/></div>
        <div><label className="tk-label">Fecha de nacimiento</label><input className="tk-input" type="date" required min="1930-01-01" max={todayStr()} value={f.dob||""} onChange={e=>set("dob",e.target.value)}/></div>
      </div>
      <div className="form-row form-row-3">
        <div><label className="tk-label">Cinturón</label><select className="tk-input" value={f.belt} onChange={e=>set("belt",e.target.value)}>{BELT_LIST.map(b=><option key={b} value={b}>{beltLabel(b)}</option>)}</select></div>
        <div><label className="tk-label">Fecha de ingreso</label><input className="tk-input" type="date" value={f.joined} onChange={e=>set("joined",e.target.value)}/></div>
        <div><label className="tk-label">Clase/Horario</label><select className="tk-input" value={f.claseId||""} onChange={e=>set("claseId",e.target.value)}>
          <option value="">— Sin clase —</option>
          {api&&api.getClases().map(cl=><option key={cl.id} value={cl.id}>{cl.nombre} · {cl.dias} · {cl.horaInicio}-{cl.horaFin}</option>)}
        </select></div>
      </div>
      <div className="form-row form-row-2">
        <div><label className="tk-label">Día de pago (mensualidad)</label><select className="tk-input" value={f.diaPago||1} onChange={e=>set("diaPago",parseInt(e.target.value))}><option value={1}>Día 1 de cada mes</option><option value={15}>Día 15 de cada mes</option></select></div>
      </div>
      <div className="form-row form-row-2">
        {!initial&&<div><label className="tk-label">Cuenta del tutor</label><select className="tk-input" value={f.tutorExistente||""} onChange={e=>set("tutorExistente",e.target.value)}>
          <option value="">Tutor nuevo (crea una cuenta)</option>
          {tutoresExistentes.map(t=><option key={t.respId} value={t.respId}>{t.parent} ({t.usuarioLogin})</option>)}
        </select></div>}
        <div><label className="tk-label">Parentesco</label><select className="tk-input" value={f.parentesco||""} onChange={e=>set("parentesco",e.target.value)}><option value="">— Seleccionar —</option>{PARENTESCOS.map(p=><option key={p}>{p}</option>)}</select></div>
      </div>
      {!f.tutorExistente&&<div className="form-row form-row-2">
        <div><label className="tk-label">Padre / Tutor</label><input className="tk-input" value={f.parent} onChange={e=>set("parent",e.target.value)}/></div>
        <div><label className="tk-label">Teléfono</label><input className="tk-input" value={f.phone} onChange={e=>set("phone",e.target.value)}/></div>
      </div>}
      <div className="form-row"><div><label className="tk-label">Correo electrónico</label><input className="tk-input" type="email" value={f.email} onChange={e=>set("email",e.target.value)}/></div></div>
      <div style={{fontSize:11,color:"#555577",textTransform:"uppercase",letterSpacing:.8,margin:"14px 0 10px"}}>Datos personales adicionales</div>
      <div className="form-row form-row-2">
        <div><label className="tk-label">Dirección</label><input className="tk-input" value={f.personal?.address||""} onChange={e=>setP("address",e.target.value)}/></div>
        <div><label className="tk-label">Tipo de sangre</label><select className="tk-input" value={f.personal?.blood||""} onChange={e=>setP("blood",e.target.value)}><option value="">— Seleccionar —</option>{["A+","A-","B+","B-","AB+","AB-","O+","O-"].map(t=><option key={t}>{t}</option>)}</select></div>
      </div>
      <div className="form-row form-row-2">
        <div><label className="tk-label">Contacto de emergencia</label><input className="tk-input" value={f.personal?.emergency||""} onChange={e=>setP("emergency",e.target.value)}/></div>
        <div><label className="tk-label">Teléfono de emergencia</label><input className="tk-input" value={f.personal?.emergencyPhone||""} onChange={e=>setP("emergencyPhone",e.target.value)}/></div>
      </div>
      <div className="form-row"><div><label className="tk-label">Notas médicas / condiciones</label><textarea className="tk-input" rows={2} value={f.personal?.medNotes||""} onChange={e=>setP("medNotes",e.target.value)} placeholder="Ej. Asma leve, alergia a..., ninguna"/></div></div>
      <div style={{borderTop:"1px solid #1e1e2e",paddingTop:14,marginTop:8}}>
        <div style={{fontSize:11,color:"#555577",letterSpacing:.8,textTransform:"uppercase",marginBottom:10}}>Acceso al portal</div>
        <div className="form-row form-row-2">
          <div><label className="tk-label">ID / Usuario</label><input className="tk-input" readOnly style={{opacity:.7,cursor:"not-allowed"}} value={f.user} placeholder="Se genera al escribir el nombre"/></div>
          <div style={{fontSize:12,color:"#7070a0",alignSelf:"center"}}>{f.tutorExistente?"El alumno entra a la cuenta de su tutor, con la misma contraseña.":"La contraseña temporal se genera al guardar y solo se muestra una vez."}</div>
        </div>
      </div>
      <div className="form-actions">
        <button type="button" className="tk-btn btn-ghost" onClick={onClose}>Cancelar</button>
        <button type="submit" className="tk-btn btn-red">Guardar alumno</button>
      </div>
    </form>
  );
};

// ─── ADMIN ALUMNOS ────────────────────────────────────────────────────────────
const AdminStudents = ({api,isMaestro}) => {
  const [modal,setModal]=useState(null);const [search,setSearch]=useState("");
  const students=api.getStudents();
  const filtered=students.filter(s=>s.name.toLowerCase().includes(search.toLowerCase())||s.parent.toLowerCase().includes(search.toLowerCase()));
  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
        <div className="section-title">ALUMNOS</div>
        <div style={{display:"flex",gap:10,alignItems:"center"}}>
          <input className="tk-input" style={{width:220}} placeholder="Buscar alumno..." value={search} onChange={e=>setSearch(e.target.value)}/>
          <button className="tk-btn btn-red" onClick={()=>setModal("add")}><Icon name="plus" size={14}/>Nuevo alumno</button>
        </div>
      </div>
      <div className="card">
        <table>
          <thead><tr><th>Alumno</th><th>Edad</th><th>Cinturón</th><th>Clase</th><th>Tutor</th><th>Teléfono</th><th>Ingreso</th><th>Próx. Examen</th><th></th></tr></thead>
          <tbody>
            {filtered.length===0&&<tr><td colSpan={8}><div className="empty-state"><div className="empty-icon">👥</div><div>Sin alumnos</div></div></td></tr>}
            {filtered.map(s=>{
              const nd=api.getNextExamDate(s.id);const dys=daysUntil(nd);
              const col=dys<0?"#f87171":dys<=7?"#f87171":dys<=21?"#d4960f":"#4ade80";
              return(
                <tr key={s.id}>
                  <td><span style={{color:"#dde0ee",fontWeight:500}}>{s.name}</span></td>
                  <td>{s.age} años</td><td><BeltBadge belt={s.belt}/></td>
                  <td>{s.claseNombre?<div style={{fontSize:11}}><div style={{color:"#dde0ee",fontWeight:500}}>{s.claseNombre}</div>{s.claseDias&&<div style={{color:"#9090b0"}}>{s.claseDias}</div>}<div style={{color:"#666688"}}>{s.claseHora}</div></div>:<span style={{color:"#444466"}}>—</span>}</td>
                  <td>{s.parent}</td>
                  <td style={{fontFamily:"monospace"}}>{s.phone}</td><td>{fmtDate(s.joined)}</td>
                  <td><span style={{color:col,fontSize:12,fontWeight:500}}>{fmtDate(nd)}</span><span style={{color:"#555577",fontSize:11,display:"block"}}>{dys>=0?`en ${dys}d`:`hace ${Math.abs(dys)}d`}</span></td>
                  <td>
                    <div style={{display:"flex",gap:5}}>
                      <button className="tk-btn btn-blue btn-sm" title="Exámenes" onClick={()=>setModal({exams:s})}><Icon name="diploma" size={13}/></button>
                      <button className="tk-btn btn-ghost btn-sm" onClick={()=>setModal({edit:s})}><Icon name="edit" size={13}/></button>
                      {!isMaestro&&<button className="tk-btn btn-ghost btn-sm" title="Nueva contraseña temporal" onClick={()=>{if(window.confirm(`¿Generar una contraseña temporal nueva para ${s.name}? La actual dejará de servir.`))api.resetAcceso(s.id);}}>🔑</button>}
                      {!isMaestro&&<button className="tk-btn btn-danger btn-sm" onClick={()=>setModal({del:s.id})}><Icon name="trash" size={13}/></button>}
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      {modal==="add"&&<Modal title="NUEVO ALUMNO" onClose={()=>setModal(null)} lg><StudentForm api={api} onSave={d=>api.addStudent(d)} onClose={()=>setModal(null)}/></Modal>}
      {modal?.edit&&<Modal title="EDITAR ALUMNO" onClose={()=>setModal(null)} lg><StudentForm api={api} initial={modal.edit} onSave={d=>api.updateStudent(modal.edit.id,d)} onClose={()=>setModal(null)}/></Modal>}
      {modal?.del&&<ConfirmModal message="¿Eliminar este alumno? Esta acción no se puede deshacer." onConfirm={()=>api.deleteStudent(modal.del)} onClose={()=>setModal(null)}/>}
      {modal?.exams&&<StudentExamsModal student={modal.exams} api={api} onClose={()=>setModal(null)}/>}
    </div>
  );
};

// ─── ADMIN PAGOS ──────────────────────────────────────────────────────────────
const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const HistorialMeses = ({api}) => {
  const [abierto,setAbierto]=useState(null);
  const students=api.getStudents();
  const mensualidades=api.getPayments().filter(p=>p.concept==="Mensualidad");
  const mesDe=(p)=>{
    if(p.mesPagado) return {mes:p.mesPagado-1,anio:p.anioPagado};
    const d=parseDate(p.start); return {mes:d.getMonth(),anio:d.getFullYear()};
  };
  // Meses con algún pago registrado, más todos los transcurridos desde que corren las mensualidades
  const claves=new Set(mensualidades.map(p=>{const m=mesDe(p);return m.anio*12+m.mes;}));
  const hoy=new Date();const claveHoy=hoy.getFullYear()*12+hoy.getMonth();
  for(let c=INICIO_MENSUALIDADES.getFullYear()*12+INICIO_MENSUALIDADES.getMonth();c<=claveHoy;c++) claves.add(c);
  const meses=[...claves].sort((a,b)=>b-a).map(c=>{
    const mes=c%12, anio=Math.floor(c/12);
    const delMes=mensualidades.filter(p=>esMensualidadDe(p,mes,anio));
    const finDeMes=new Date(anio,mes+1,0);
    const lista=students.map(s=>({s,pago:delMes.find(p=>pagoEsDe(p,s))}))
      .filter(({s,pago})=>pago||!s.joined||parseDate(s.joined)<=finDeMes);
    const conocidos=lista.filter(x=>x.pago).map(x=>x.pago.id);
    const deBaja=delMes.filter(p=>!conocidos.includes(p.id));
    return {c,mes,anio,pagaron:lista.filter(x=>x.pago),noPagaron:lista.filter(x=>!x.pago),deBaja};
  });
  if(meses.length===0) return <div className="card empty-state" style={{padding:40}}><div className="empty-icon">📅</div><div>Todavía no hay meses en el historial</div></div>;
  return(
    <div style={{display:"grid",gap:10}}>
      {meses.map(m=>{
        const totalPagaron=m.pagaron.length+m.deBaja.length;
        return(
        <div key={m.c} className="card" style={{padding:0,overflow:"hidden"}}>
          <button onClick={()=>setAbierto(abierto===m.c?null:m.c)} style={{width:"100%",display:"flex",alignItems:"center",gap:12,flexWrap:"wrap",padding:"14px 18px",background:"none",border:"none",cursor:"pointer",textAlign:"left"}}>
            <span style={{color:"#dde0ee",fontWeight:700,fontSize:14,minWidth:150}}>{MESES[m.mes]} {m.anio}</span>
            <span style={{color:"#4ade80",fontSize:13,fontWeight:600}}>{totalPagaron} pagaron</span>
            <span style={{color:"#f87171",fontSize:13,fontWeight:600}}>{m.noPagaron.length} no pagaron</span>
            <span style={{marginLeft:"auto",color:"#9090b0",fontSize:13}}>{mxn(totalPagaron*500)} {abierto===m.c?"▲":"▼"}</span>
          </button>
          {abierto===m.c&&(
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(240px,1fr))",gap:16,padding:"4px 18px 18px",borderTop:"1px solid #1a1a28"}}>
              <div>
                <div style={{color:"#4ade80",fontSize:11,fontWeight:700,letterSpacing:.8,textTransform:"uppercase",margin:"12px 0 8px"}}>Pagaron</div>
                {totalPagaron===0&&<div style={{color:"#555577",fontSize:13}}>Nadie registrado</div>}
                {m.pagaron.map(({s,pago})=><div key={s.id} style={{display:"flex",justifyContent:"space-between",gap:10,padding:"5px 0",fontSize:13,color:"#dde0ee"}}><span>{s.name}</span><span style={{color:"#666688",fontSize:12,whiteSpace:"nowrap"}}>{fmtDate(pago.start)}</span></div>)}

const MensualidadesPanel = ({api}) => {
  const now = new Date();
  // Antes de la fecha de inicio el panel abre directamente en el primer mes que corre
  const inicial = now < INICIO_MENSUALIDADES ? INICIO_MENSUALIDADES : now;
  const [vista, setVista] = useState("mes");
  const [mes, setMes] = useState(inicial.getMonth());
  const [anio, setAnio] = useState(inicial.getFullYear());
  const students = api.getStudents();
  const payments = api.getPayments();
  const enInicio = anio===INICIO_MENSUALIDADES.getFullYear() && mes===INICIO_MENSUALIDADES.getMonth();
  const prevMes = () => { if(enInicio) return; if(mes===0){setMes(11);setAnio(a=>a-1);}else setMes(m=>m-1); };
  const nextMes = () => { if(mes===11){setMes(0);setAnio(a=>a+1);}else setMes(m=>m+1); };
  const pagoDeAlumno = (s) => payments.find(p => pagoEsDe(p,s) && esMensualidadDe(p,mes,anio));
  const totalPagados = students.filter(s=>!!pagoDeAlumno(s)).length;
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const esVencido = (s) => {
    if(pagoDeAlumno(s)) return false;
    if(new Date(anio,mes,1) < INICIO_MENSUALIDADES) return false;
    // Un alumno no debe los meses anteriores a su ingreso
    if(s.joined && parseDate(s.joined) > new Date(anio,mes+1,0)) return false;
    return hoy > new Date(anio, mes, s.diaPago||1);
  };
  const vencidos = students.filter(s=>esVencido(s)).length;
  return(
    <div>
      <div style={{display:"flex",gap:8,marginBottom:16}}>
        <button className={`tk-btn btn-sm ${vista==="mes"?"btn-red":"btn-ghost"}`} onClick={()=>setVista("mes")}>Mes por mes</button>
        <button className={`tk-btn btn-sm ${vista==="historial"?"btn-red":"btn-ghost"}`} onClick={()=>setVista("historial")}>Historial de meses</button>
      </div>
      {now<INICIO_MENSUALIDADES&&<div style={{background:"rgba(96,165,250,.08)",border:"1px solid rgba(96,165,250,.25)",borderRadius:8,padding:"10px 14px",marginBottom:16,color:"#93c5fd",fontSize:13}}>Las mensualidades empiezan a correr el 1 de {MESES[INICIO_MENSUALIDADES.getMonth()].toLowerCase()} de {INICIO_MENSUALIDADES.getFullYear()}. Antes de esa fecha no se marcan vencidas.</div>}
      {vista==="historial"&&<HistorialMeses api={api}/>}
      {vista==="mes"&&<>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:20,flexWrap:"wrap"}}>
        <button className="tk-btn btn-ghost btn-sm" onClick={prevMes} disabled={enInicio}>‹</button>
        <span style={{color:"#dde0ee",fontWeight:700,fontSize:16,minWidth:170,textAlign:"center"}}>{MESES[mes]} {anio}</span>
        <button className="tk-btn btn-ghost btn-sm" onClick={nextMes}>›</button>
        <span style={{marginLeft:"auto",color:"#9090b0",fontSize:13}}>
          <span style={{color:"#4ade80",fontWeight:600}}>{totalPagados}</span>/{students.length} pagados
          {vencidos>0&&<>&nbsp;·&nbsp;<span style={{color:"#f87171",fontWeight:600}}>{vencidos} vencidos</span></>}
          &nbsp;·&nbsp;
          <span style={{color:"#4ade80",fontWeight:600}}>${totalPagados*500}</span> recaudado
        </span>
      </div>
      {vencidos>0&&<div style={{background:"rgba(239,68,68,.1)",border:"1px solid rgba(239,68,68,.3)",borderRadius:8,padding:"10px 14px",marginBottom:16,color:"#f87171",fontSize:13,fontWeight:500}}>⚠ {vencidos} alumno{vencidos>1?"s":""} con la mensualidad de {MESES[mes]} vencida (ya pasó su día de pago).</div>}
      <div className="card" style={{padding:0,overflow:"hidden"}}>
        <table>
          <thead><tr><th>Alumno</th><th>Cinturón</th><th>Día pago</th><th>Monto</th><th style={{textAlign:"center"}}>Estado</th></tr></thead>
          <tbody>
            {students.length===0&&<tr><td colSpan={5}><div className="empty-state"><div className="empty-icon">👥</div><div>Sin alumnos registrados</div></div></td></tr>}
            {students.map(s=>{
              const pago=pagoDeAlumno(s);
              const pagado=!!pago;
              const vencido=!pagado&&esVencido(s);
              return(
                <tr key={s.id}>
                  <td style={{color:"#dde0ee",fontWeight:500}}>{s.name}</td>
                  <td><BeltBadge belt={s.belt}/></td>
                  <td style={{color:"#9090b0"}}>Día {s.diaPago||1}</td>
                  <td style={{color:"#9090b0",fontWeight:600}}>$500</td>
                  <td style={{textAlign:"center"}}>
                    <label style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8,cursor:"pointer"}}>
                      <input type="checkbox" checked={pagado}
                        onChange={e=>api.pagarMensualidad(s,e.target.checked,mes,anio,todayStr())}
                        style={{width:18,height:18,cursor:"pointer",accentColor:"#c01212"}}/>
                      <span style={{color:pagado?"#4ade80":vencido?"#f87171":"#d4960f",fontSize:13,fontWeight:600,minWidth:80}}>
                        {pagado?"✓ Pagado":vencido?"⚠ Vencido":"Pendiente"}
                      </span>
                    </label>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      </>}
    </div>
  );
};

const AbonoForm = ({pago,onSave,onClose}) => {

  const [monto,setMonto]=useState("");

  return(

const ClaseForm = ({initial,onSave,onClose,instructores=[]}) => {
  const empty={nombre:"",dia_semana:"",hora_inicio:"",hora_fin:"",id_instructor:"1"};
  const [f,setF]=useState(initial||empty);
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const submit=(e)=>{e.preventDefault();onSave(f);onClose();};
  return(
    <form onSubmit={submit}>
      <div className="form-row form-row-2">
        <div><label className="tk-label">Nombre del horario</label><input className="tk-input" required value={f.nombre} onChange={e=>set("nombre",e.target.value)} placeholder="Ej. Horario A"/></div>
        <div><label className="tk-label">Maestro</label><select className="tk-input" value={f.id_instructor||"1"} onChange={e=>set("id_instructor",e.target.value)}>
          {instructores.map(i=><option key={i.id} value={i.id}>{i.nombre} — {i.cargo||"Instructor"}</option>)}

      </div>
      <div className="form-row">
        <div><label className="tk-label">Días</label><input className="tk-input" required value={f.dia_semana} onChange={e=>set("dia_semana",e.target.value)} placeholder="Ej. Martes, Miércoles, Jueves"/></div>

// ─── PARENTESCO ───────────────────────────────────────────────────────────────
const PARENTESCOS = ["Madre","Padre","Tutor","Abuelo/a","Tío/a","Hermano/a","Otro"];
const AdminParentesco = ({api,isMaestro}) => {
  const [buscar,setBuscar]=useState("");
  const students=api.getStudents();
  const tutores=Object.values(students.reduce((acc,s)=>{
    (acc[s.respId]=acc[s.respId]||{respId:s.respId,nombre:s.parent,telefono:s.phone,login:s.usuarioLogin,alumnos:[]}).alumnos.push(s);
    return acc;
  },{})).sort((a,b)=>(a.nombre||"").localeCompare(b.nombre||""));
  const q=buscar.trim().toLowerCase();
  const visibles=tutores.filter(t=>!q||(t.nombre||"").toLowerCase().includes(q)||t.alumnos.some(a=>a.name.toLowerCase().includes(q)));
  const mover=async(alumno,destino)=>{
    if(destino==="__nuevo__"){
      const nombre=window.prompt(`Nombre del nuevo tutor de ${alumno.name}:`);
      if(!nombre||!nombre.trim()) return;
      const telefono=window.prompt("Teléfono del nuevo tutor (opcional):")||"";
      await api.moverDeTutor(alumno.id,{nuevo_tutor:{nombre:nombre.trim(),telefono:telefono.trim()}});
      return;
    }
    const t=tutores.find(x=>x.respId===destino);
    if(window.confirm(`¿Pasar a ${alumno.name} a la cuenta de ${t.nombre}?\n\nSus pagos se van con el alumno. Después se entra con la contraseña de ${t.nombre}.`))
      await api.moverDeTutor(alumno.id,{num_control_responsable:destino});
  };
  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,flexWrap:"wrap",marginBottom:8}}>
        <div className="section-title">PARENTESCO</div>
        <input className="tk-input" style={{width:240}} placeholder="Buscar tutor o alumno..." value={buscar} onChange={e=>setBuscar(e.target.value)}/>
      </div>
      <div style={{color:"#7070a0",fontSize:13,marginBottom:16}}>Cada tutor tiene una sola cuenta y ve a todos sus alumnos. Puede entrar con el ID de cualquiera de ellos, con la misma contraseña.</div>
      <div style={{display:"grid",gap:12}}>
        {visibles.length===0&&<div className="card empty-state" style={{padding:40}}><div className="empty-icon">👨‍👧</div><div>Sin resultados</div></div>}
        {visibles.map(t=>(
          <div key={t.respId} className="card" style={{padding:18}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,flexWrap:"wrap",marginBottom:12}}>
              <div>
                <div style={{color:"#f0f0fa",fontWeight:600,fontSize:15}}>{t.nombre||"Sin nombre"}</div>
                <div style={{color:"#666688",fontSize:12,marginTop:3}}>{t.telefono&&t.telefono!=="0"?`Tel. ${t.telefono} · `:""}{t.alumnos.length} alumno{t.alumnos.length!==1?"s":""}{t.login?` · Cuenta: ${t.login}`:""}</div>
              </div>
              {!isMaestro&&<button className="tk-btn btn-ghost btn-sm" onClick={()=>{if(window.confirm(`¿Generar una contraseña temporal nueva para ${t.nombre}? La actual dejará de servir.`))api.resetAcceso(t.alumnos[0].id);}}>🔑 Nueva contraseña</button>}
            </div>
            <div style={{display:"grid",gap:8}}>
              {t.alumnos.map(a=>(
                <div key={a.id} style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",background:"#0e0e18",borderRadius:8,padding:"10px 12px"}}>
                  <div style={{flex:"1 1 180px"}}><div style={{color:"#dde0ee",fontSize:13,fontWeight:500}}>{a.name}</div><div style={{color:"#555577",fontSize:11,marginTop:2}}>{a.id}</div></div>
                  <BeltBadge belt={a.belt}/>
                  <select className="tk-input" style={{width:130}} aria-label={`Parentesco de ${a.name}`} value={a.parentesco||""} onChange={e=>api.moverDeTutor(a.id,{num_control_responsable:a.respId,parentesco:e.target.value})}>
                    <option value="" disabled>Parentesco</option>
                    {PARENTESCOS.map(p=><option key={p}>{p}</option>)}
                  </select>
                  <select className="tk-input" style={{width:190}} aria-label={`Cambiar tutor de ${a.name}`} value="" onChange={e=>e.target.value&&mover(a,e.target.value)}>
                    <option value="">Cambiar de tutor…</option>
                    {tutores.filter(x=>x.respId!==a.respId).map(x=><option key={x.respId} value={x.respId}>{x.nombre} ({x.login})</option>)}
                    {t.alumnos.length>1&&<option value="__nuevo__">+ Crear tutor nuevo</option>}
                  </select>
                </div>
              ))}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
};

    {label:"Alumnos activos",value:students.filter(s=>s.active).length,color:"#c01212"},

          <div style={{fontSize:22}}>🔔</div>
          <div>
            <div style={{color:"#d4960f",fontWeight:700,fontSize:13,marginBottom:6}}>{examSoon.length} alumno{examSoon.length!==1?"s":""} con examen en los próximos 14 días</div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>{examSoon.map(s=>{const d=daysUntil(api.getNextExamDate(s.id));return<span key={s.id} style={{background:"rgba(212,150,15,.15)",padding:"3px 10px",borderRadius:20,fontSize:12,color:"#fef08a"}}>{s.name} — en {d}d</span>;})}</div>

// ─── STUDENT LOCKERS ─────────────────────────────────────────────────────────
const StudentLockers = ({api, student, onToast}) => {
  const [loading, setLoading] = useState(false);
  const [confirm, setConfirm] = useState(null); // {action:'tomar'|'liberar', locker}
  const lockers = api.getLockers();
  const miLocker = lockers.find(l=>l.alumnoId===student.id);

  const handleTomar = async (locker) => {
    setLoading(true);
    const ok = await api.asignarLocker(locker.id, student.id);
    setLoading(false);
    if(ok) onToast(`¡Locker #${locker.numero} asignado!`);
    else onToast("Error al asignar locker");
    setConfirm(null);
  };

  const handleLiberar = async () => {
    if(!miLocker) return;
    setLoading(true);
    await api.liberarLocker(miLocker.id);
    setLoading(false);
    onToast("Locker liberado correctamente");
    setConfirm(null);
  };

  return (
    <div>
      <div className="section-title" style={{marginBottom:4}}>LOCKERS</div>
      <div style={{color:"#555577",fontSize:12,marginBottom:20}}>Selecciona un locker disponible. Los lockers en rojo ya están ocupados.</div>

      {miLocker && (
        <div style={{background:"rgba(74,222,128,.08)",border:"1px solid rgba(74,222,128,.3)",borderRadius:10,padding:"16px 20px",marginBottom:24,display:"flex",alignItems:"center",justifyContent:"space-between",gap:12}}>
          <div style={{display:"flex",alignItems:"center",gap:14}}>
            <div style={{fontSize:28}}>🔒</div>
            <div>
              <div style={{color:"#4ade80",fontWeight:700,fontSize:14}}>Tu locker actual: #{miLocker.numero}</div>
              <div style={{color:"#9090b0",fontSize:12,marginTop:2}}>Color: {miLocker.color} · Asignado el {fmtDate(miLocker.fechaAsignacion)}</div>
            </div>
          </div>
          <button className="tk-btn btn-danger btn-sm" onClick={()=>setConfirm({action:"liberar"})} disabled={loading}>
            Liberar locker
          </button>
        </div>
      )}

      {lockers.length===0 ? (
        <div className="empty-state"><div className="empty-icon">🔒</div><div>No hay lockers disponibles aún</div><div style={{fontSize:12,marginTop:8}}>Contacta al maestro para más información</div></div>
      ) : (
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(170px,1fr))",gap:10}}>
          {lockers.map(l=>{
            const clr = LOCKER_COLOR_MAP[l.color]||"#6b7280";
            const esMio = l.alumnoId===student.id;
            const ocupado = !!l.alumnoId && !esMio;
            const libre = !l.alumnoId;
            return (
              <div key={l.id} style={{
                background: esMio?"rgba(74,222,128,.08)":ocupado?"rgba(239,68,68,.07)":"#13131e",
                border: esMio?"1px solid rgba(74,222,128,.4)":ocupado?"1px solid rgba(239,68,68,.3)":"1px solid #1e1e2e",
                borderRadius:10,padding:"14px 16px",
                cursor: libre?"pointer":"default",
                transition:"all .15s",
                opacity: ocupado?0.6:1,
                position:"relative",overflow:"hidden"
              }}
              onClick={()=>{if(libre && !loading) setConfirm({action:"tomar",locker:l});}}>
                <div style={{position:"absolute",top:0,left:0,width:3,height:"100%",background:clr,borderRadius:"10px 0 0 10px"}}/>
                <div style={{paddingLeft:6}}>
                  <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:26,color: esMio?"#4ade80":ocupado?"#f87171":"#f0f0fa",letterSpacing:1,lineHeight:1}}>#{l.numero}</div>
                  <div style={{fontSize:10,color:clr,fontWeight:600,textTransform:"uppercase",letterSpacing:.5,margin:"4px 0 6px"}}>{l.color}</div>
                  {esMio && <span style={{fontSize:10,fontWeight:700,color:"#4ade80",background:"rgba(74,222,128,.15)",padding:"2px 7px",borderRadius:20}}>✓ El tuyo</span>}
                  {ocupado && <span style={{fontSize:10,fontWeight:600,color:"#f87171",background:"rgba(239,68,68,.12)",padding:"2px 7px",borderRadius:20}}>Ocupado</span>}
                  {libre && <span style={{fontSize:10,fontWeight:600,color:"#4ade80",background:"rgba(74,222,128,.1)",padding:"2px 7px",borderRadius:20}}>Disponible →</span>}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {confirm?.action==="tomar"&&(
        <div className="overlay">
          <div className="modal">
            <div className="modal-title">ELEGIR LOCKER</div>
            <div style={{marginBottom:20,color:"#b0b0cc",lineHeight:1.7}}>
              ¿Quieres asignarte el locker <strong style={{color:"#f0f0fa"}}>#{confirm.locker.numero}</strong>?
              {miLocker&&<span style={{color:"#d4960f"}}> Tu locker anterior (#{miLocker.numero}) quedará libre.</span>}
            </div>
            <div className="form-actions">
              <button className="tk-btn btn-ghost" onClick={()=>setConfirm(null)}>Cancelar</button>
              <button className="tk-btn btn-green" onClick={()=>handleTomar(confirm.locker)} disabled={loading}>
                {loading?"Asignando...":"Sí, tomar este locker"}
              </button>
            </div>
          </div>
        </div>
      )}

      {confirm?.action==="liberar"&&(
        <div className="overlay">
          <div className="modal">
            <div className="modal-title">LIBERAR LOCKER</div>
            <div style={{marginBottom:20,color:"#b0b0cc",lineHeight:1.7}}>
              ¿Confirmas que ya no usarás el locker <strong style={{color:"#f0f0fa"}}>#{miLocker?.numero}</strong>? Quedará disponible para otros alumnos.
            </div>
            <div className="form-actions">
              <button className="tk-btn btn-ghost" onClick={()=>setConfirm(null)}>Cancelar</button>
              <button className="tk-btn btn-danger" onClick={handleLiberar} disabled={loading}>
                {loading?"Liberando...":"Sí, liberar locker"}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

const WHATSAPP_ADMIN = "529612087231"; // WhatsApp del maestro admin (sin + ni espacios)
const DudaModal = ({student,api,onToast,onClose}) => {
  const [msg,setMsg]=useState("");
  const [sending,setSending]=useState(false);
  const enviarPlataforma = async () => {
    if(!msg.trim()){ onToast("Escribe tu duda primero"); return; }
    setSending(true);
    try { await api.enviarDuda({mensaje:msg.trim(), remitente:student.name, num_control:student.user}); onToast("Duda enviada ✓"); onClose(); }
    catch(e){ onToast("No se pudo enviar. Intenta por WhatsApp."); }
    finally { setSending(false); }
  };
  const enviarWhatsApp = () => {
    if(!msg.trim()){ onToast("Escribe tu duda primero"); return; }
    const texto = `Hola, soy ${student.name} (ID ${student.user}). Tengo una duda sobre la plataforma:\n\n${msg.trim()}`;
    window.open(`https://wa.me/${WHATSAPP_ADMIN}?text=${encodeURIComponent(texto)}`, "_blank");
    onClose();
  };
  return (
    <Modal title="¿TIENES UNA DUDA?" onClose={onClose}>
      <div style={{color:"#9090b0",fontSize:13,marginBottom:14,lineHeight:1.5}}>
        Escribe tu duda lo más <strong style={{color:"#dde0ee"}}>clara y completa</strong> posible. Mientras más contexto des (qué estabas haciendo, qué esperabas y qué pasó), más rápido te podremos ayudar.
      </div>
      <textarea className="tk-input" rows={5} value={msg} onChange={e=>setMsg(e.target.value)} placeholder="Describe tu duda aquí..." style={{resize:"vertical",fontFamily:"inherit",width:"100%"}}/>
      <div style={{display:"flex",gap:10,marginTop:16,flexWrap:"wrap"}}>
        <button className="tk-btn btn-red" disabled={sending} onClick={enviarPlataforma} style={{flex:1,minWidth:150}}>{sending?"Enviando...":"Enviar por la plataforma"}</button>
        <button className="tk-btn btn-blue" onClick={enviarWhatsApp} style={{flex:1,minWidth:150}}>Enviar por WhatsApp</button>
      </div>
    </Modal>
  );
};

const AdminBuzon = ({api}) => {
  const [dudas,setDudas]=useState([]);
  const [loading,setLoading]=useState(true);
  const [toast,setToast]=useState(null);
  const cargar = async () => {
    setLoading(true);
    try { const d = await api.getDudas(); setDudas(d); } catch(e){ setDudas([]); }
    finally { setLoading(false); }
  };
  useEffect(()=>{ cargar(); }, []);
  const marcar = async (id) => { try { await api.markDudaLeida(id); setDudas(ds=>ds.map(d=>d.id_duda===id?{...d,leido:true}:d)); }catch(e){ setToast("No se pudo actualizar"); } };
  const borrar = async (id) => { try { await api.deleteDuda(id); setDudas(ds=>ds.filter(d=>d.id_duda!==id)); }catch(e){ setToast("No se pudo eliminar"); } };
  const noLeidas = dudas.filter(d=>!d.leido).length;
  return (
    <div>
      <div className="section-title" style={{marginBottom:6}}>BUZÓN DE DUDAS</div>
      <div style={{color:"#7070a0",fontSize:13,marginBottom:20}}>{noLeidas>0?`${noLeidas} sin leer`:"Todo al día"}</div>
      {loading?(
        <div className="card" style={{padding:40,textAlign:"center",color:"#666688"}}>Cargando...</div>
      ):dudas.length===0?(
        <div className="card empty-state" style={{padding:48}}><div className="empty-icon">📭</div><div>No hay dudas todavía</div></div>
      ):(
        <div style={{display:"grid",gap:12}}>
          {dudas.map(d=>(
            <div key={d.id_duda} className="card" style={{padding:18,borderLeft:`3px solid ${d.leido?"#2a2a3e":"#c01212"}`}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:12,marginBottom:8}}>
                <div>
                  <div style={{color:"#f0f0fa",fontWeight:600,fontSize:14}}>{d.remitente||"Usuario"}{d.num_control&&<span style={{color:"#555577",fontWeight:400}}> · {d.num_control}</span>}</div>
                  <div style={{color:"#555577",fontSize:11,marginTop:2}}>{fmtDate((d.fecha||"").split("T")[0])} {((d.fecha||"").split("T")[1]||"").slice(0,5)}</div>
                </div>
                <div style={{display:"flex",gap:6}}>
                  {!d.leido&&<button className="tk-btn btn-ghost btn-sm" onClick={()=>marcar(d.id_duda)}>Marcar leída</button>}
                  <button className="tk-btn btn-danger btn-sm" onClick={()=>borrar(d.id_duda)}><Icon name="trash" size={12}/></button>
                </div>
              </div>
              <div style={{color:"#c8c8e0",fontSize:13,lineHeight:1.5,whiteSpace:"pre-wrap"}}>{d.mensaje}</div>
            </div>
          ))}
        </div>
      )}
      {toast&&<Toast msg={toast} onDone={()=>setToast(null)}/>}
    </div>
  );
};
